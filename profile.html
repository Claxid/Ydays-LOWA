<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profil — LOWA</title>
    <link rel="stylesheet" href="/assets/style/homepage.css" />
    <style>
      :root {
        --profile-bg: var(--pastel-bg, #eef7ef);
        --profile-card: #fff;
        --profile-border: var(--pastel-green);
        --profile-accent: var(--accent);
      }
      .profile-wrapper {
        max-width: 1000px;
        margin: 0 auto;
        padding: 2rem 1rem;
      }
      .profile-hero {
        background: linear-gradient(135deg, rgba(77,143,93,0.08), rgba(77,143,93,0.02));
        border: 1px solid var(--profile-border);
        border-radius: 16px;
        padding: 1.5rem 2rem;
        display: flex;
        align-items: center;
        gap: 1rem;
        box-shadow: var(--shadow-large);
      }
      .avatar {
        width: 64px; height: 64px;
        border-radius: 50%;
        background: var(--profile-accent);
        color: #fff;
        display: grid; place-items: center;
        font-weight: 700; font-size: 1.2rem;
        box-shadow: var(--shadow-medium);
      }
      .card { background: var(--profile-card); border:1px solid var(--profile-border); border-radius:12px; padding:1rem 1.25rem; box-shadow: var(--shadow-medium); }
      .card h3 { margin-top:0; color: var(--dark); }
      .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
      .info-row { display:flex; gap: .5rem; margin:.2rem 0; }
      .info-row strong { min-width: 120px; color: var(--dark); }
      .history-item { padding:.6rem .4rem; border-bottom:1px solid #eee; display:flex; justify-content:space-between; }
      .pill { display:inline-block; padding:.2rem .6rem; border:1px solid var(--profile-border); border-radius:999px; color: var(--accent); background:#f7fbf7; font-size:.85rem; }
      .actions { display:flex; gap:.6rem; align-items:center; }
      .btn.primary { background: var(--accent); color:#fff; }
      .section { margin-top:1.5rem; }
    </style>
    <script src="/api-config.js"></script>
  </head>
  <body>
    <header class="site-header">
      <div class="container header-inner">
        <a class="brand" href="/">LOWA</a>
        <nav class="main-nav">
          <a href="/">Accueil</a>
        </nav>
        <div class="header-actions">
          <button id="logout-btn" class="btn">Déconnexion</button>
        </div>
      </div>
    </header>

    <main class="profile-wrapper">
      <div class="profile-hero">
        <div class="avatar" id="avatar">LG</div>
        <div>
          <h1 style="margin:0">Mon profil</h1>
          <div class="pill" id="member-since">Membre depuis —</div>
        </div>
        <div class="actions" style="margin-left:auto">
          <button id="logout-btn-hero" class="btn">Déconnexion</button>
        </div>
      </div>

      <div class="grid-2 section">
        <section class="card">
          <h3>Informations utilisateur</h3>
          <div id="user-info"></div>
        </section>
        <section class="card">
          <h3>Préférences</h3>
          <label style="display:flex;gap:0.5rem;align-items:center">
            <input type="checkbox" id="cookie-consent" />
            Consentement aux cookies
          </label>
          <button id="save-prefs" class="btn primary" style="margin-top:1rem">Enregistrer</button>
          <p id="prefs-status" style="margin-top:0.5rem;color:var(--muted)"></p>
        </section>
      </div>

      <section class="card section">
        <h3>Historique d'achats</h3>
        <div id="history"></div>
      </section>
    </main>

    <script>
      const API = window.API_BASE || '/api';
      let sessionToken = null;

      function loadSession() {
        try {
          const stored = localStorage.getItem('lowa_session');
          if (!stored) return;
          const s = JSON.parse(stored);
          sessionToken = s.token;
        } catch {}
      }

      function formatSexe(val) {
        if (val === 'H') return 'Homme';
        if (val === 'F') return 'Femme';
        return val || '-';
      }

      async function fetchUser() {
        const resp = await fetch(API + '/user', { headers: { Authorization: sessionToken } });
        if (!resp.ok) throw new Error('Not authenticated');
        const user = await resp.json();
        const initials = (user.prenom?.[0] || 'L') + (user.nom?.[0] || 'G');
        document.getElementById('avatar').textContent = initials.toUpperCase();
        document.getElementById('member-since').textContent = 'Membre depuis — ' + new Date(user.date_creation).toLocaleDateString();

        document.getElementById('user-info').innerHTML = `
          <div class="info-row"><strong>Nom:</strong> <span>${user.prenom} ${user.nom}</span></div>
          <div class="info-row"><strong>Email:</strong> <span>${user.email}</span></div>
          <div class="info-row"><strong>Sexe:</strong> <span>${formatSexe(user.sexe)}</span></div>
          <div class="info-row"><strong>Créé le:</strong> <span>${new Date(user.date_creation).toLocaleString()}</span></div>
        `;
        return user;
      }

      async function fetchHistory() {
        const resp = await fetch(API + '/purchase-history', { headers: { Authorization: sessionToken } });
        if (!resp.ok) { document.getElementById('history').innerHTML = '<p>Pas d\'historique.</p>'; return; }
        const items = await resp.json();
        if (!items.length) { document.getElementById('history').innerHTML = '<p>Pas d\'historique.</p>'; return; }
        document.getElementById('history').innerHTML = items.map(i => `
          <div class="history-item" style="padding:0.5rem 0;border-bottom:1px solid #eee">
            <div><strong>Achat du:</strong> ${new Date(i.date).toLocaleString()}</div>
            <div><strong>Total:</strong> ${i.total.toFixed(2)} €</div>
          </div>
        `).join('');
      }

      async function loadPrefs() {
        // Optionally could add GET /user-preferences; for now reflect local storage
        const consent = localStorage.getItem('lowa_cookie_consent');
        if (consent) {
          try { const obj = JSON.parse(consent); document.getElementById('cookie-consent').checked = obj.status === 'accepted'; } catch {}
        }
      }

      async function savePrefs() {
        const status = document.getElementById('cookie-consent').checked ? 'accepted' : 'declined';
        const resp = await fetch(API + '/user-preferences', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', Authorization: sessionToken },
          body: JSON.stringify({ cookie_consent: status })
        });
        if (!resp.ok) throw new Error('Save failed');
        document.getElementById('prefs-status').textContent = 'Préférences enregistrées';
      }

      document.getElementById('save-prefs').addEventListener('click', async () => {
        try { await savePrefs(); } catch (e) { alert('Erreur: ' + e.message); }
      });

      document.getElementById('logout-btn').addEventListener('click', async () => {
        try { await fetch(API + '/logout', { method: 'POST', headers: { Authorization: sessionToken } }); } catch {}
        localStorage.removeItem('lowa_session');
        window.location.href = '/';
      });

      (async function init() {
        loadSession();
        try {
          await fetchUser();
          await fetchHistory();
          await loadPrefs();
        } catch (e) {
          alert('Veuillez vous connecter');
          window.location.href = '/';
        }
      })();
    </script>
  </body>
</html>
