<!DOCTYPE html>
<html lang="fr" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profil — LOWA</title>
    <link rel="preload" as="style" href="/assets/style/homepage.min.css" />
    <link rel="stylesheet" href="/assets/style/homepage.min.css" />
    <style>
      /* Theme Variables */
      :root {
        /* Light Mode (default) */
        --theme-bg: #f0f5f0;
        --theme-surface: #fff;
        --theme-text: #1a4d1a;
        --theme-text-muted: #558055;
        --theme-border: #c7e8c7;
        --theme-accent: #6ba86b;
        --theme-accent-light: rgba(107,168,107,0.1);
        --theme-input-bg: #fff;
        --theme-input-border: #c7e8c7;
        --profile-bg: var(--theme-bg);
        --profile-card: var(--theme-surface);
        --profile-border: var(--theme-border);
        --profile-accent: var(--theme-accent);
      }

      /* Dark Mode */
      html[data-theme="dark"] {
        --theme-bg: #1a2e1a;
        --theme-surface: #243b24;
        --theme-text: #d4f0d4;
        --theme-text-muted: #9dbf9d;
        --theme-border: #3a5a3a;
        --theme-accent: #6fb86f;
        --theme-accent-light: rgba(111,184,111,0.15);
        --theme-input-bg: #2d4a2d;
        --theme-input-border: #4a6a4a;
      }

      /* Temperate Mode */
      html[data-theme="temperate"] {
        --theme-bg: #faf8f3;
        --theme-surface: #fff9f5;
        --theme-text: #3d2817;
        --theme-text-muted: #6b5344;
        --theme-border: #e8dfd4;
        --theme-accent: #a67b52;
        --theme-accent-light: rgba(166,123,82,0.1);
        --theme-input-bg: #fff9f5;
        --theme-input-border: #e8dfd4;
      }

      /* Apply theme colors to main elements */
      html[data-theme] body {
        background: var(--theme-bg);
        color: var(--theme-text);
      }

      html[data-theme] a {
        color: var(--theme-accent);
      }

      html[data-theme] a:hover {
        color: var(--theme-text-muted);
      }

      html[data-theme] .site-header {
        background: var(--theme-surface);
        border-bottom-color: var(--theme-border);
      }

      html[data-theme] .main-nav a,
      html[data-theme] .main-nav button {
        color: var(--theme-text-muted);
      }

      html[data-theme] .main-nav a:hover,
      html[data-theme] .main-nav button:hover {
        color: var(--theme-text);
        background: var(--theme-accent-light);
      }

      html[data-theme] .btn {
        background: var(--theme-accent);
        color: var(--theme-surface);
        border-color: var(--theme-accent);
      }

      html[data-theme] .btn:hover {
        opacity: 0.9;
      }

      html[data-theme] input[type="text"],
      html[data-theme] input[type="email"],
      html[data-theme] input[type="password"],
      html[data-theme] select {
        background: var(--theme-input-bg);
        color: var(--theme-text);
        border-color: var(--theme-input-border);
      }

      html[data-theme] input[type="checkbox"],
      html[data-theme] input[type="radio"] {
        accent-color: var(--theme-accent);
      }

      html[data-theme] .card {
        background: var(--theme-surface);
        border-color: var(--theme-border);
        color: var(--theme-text);
      }

      html[data-theme] .profile-hero {
        background: linear-gradient(135deg, var(--theme-accent-light), transparent);
        border-color: var(--theme-border);
      }

      html[data-theme] .avatar {
        background: var(--theme-accent);
        color: var(--theme-surface);
      }

      html[data-theme] .pill {
        color: var(--theme-accent);
        background: var(--theme-accent-light);
        border-color: var(--theme-border);
      }

      html[data-theme] .history-item {
        border-bottom-color: var(--theme-border);
      }

      html[data-theme] .theme-selector {
        display: flex;
        gap: 0.5rem;
        margin-top: 0.5rem;
        flex-wrap: wrap;
      }

      html[data-theme] .theme-option {
        padding: 0.5rem 1rem;
        border: 2px solid var(--theme-border);
        border-radius: 8px;
        background: var(--theme-surface);
        color: var(--theme-text);
        cursor: pointer;
        font-weight: 500;
        transition: all 0.2s ease;
      }

      html[data-theme] .theme-option:hover {
        border-color: var(--theme-accent);
      }

      html[data-theme] .theme-option.active {
        background: var(--theme-accent);
        color: var(--theme-surface);
        border-color: var(--theme-accent);
      }

      html[data-theme] .form-group {
        margin-bottom: 1rem;
      }

      html[data-theme] .form-group label {
        display: block;
        margin-bottom: 0.5rem;
        font-weight: 500;
        color: var(--theme-text);
      }

      html[data-theme] .form-group select,
      html[data-theme] .form-group input {
        width: 100%;
        padding: 0.5rem 0.75rem;
        border: 1px solid var(--theme-input-border);
        border-radius: 6px;
        font-size: 0.95rem;
      }

      .profile-wrapper {
        max-width: 1000px;
        margin: 0 auto;
        padding: 2rem 1rem;
      }
      .profile-hero {
        box-shadow: var(--shadow-large);
        border-radius: 16px;
        padding: 1.5rem 2rem;
        display: flex;
        align-items: center;
        gap: 1rem;
      }
      .avatar {
        width: 64px; height: 64px;
        border-radius: 50%;
        display: grid; place-items: center;
        font-weight: 700; font-size: 1.2rem;
        box-shadow: var(--shadow-medium);
      }
      .card { border:1px solid var(--profile-border); border-radius:12px; padding:1rem 1.25rem; box-shadow: var(--shadow-medium); }
      .card h3 { margin-top:0; }
      .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
      .info-row { display:flex; gap: .5rem; margin:.2rem 0; }
      .info-row strong { min-width: 120px; }
      .history-item { padding:.6rem .4rem; display:flex; justify-content:space-between; }
      .pill { display:inline-block; padding:.2rem .6rem; border:1px solid var(--profile-border); border-radius:999px; font-size:.85rem; }
      .actions { display:flex; gap:.6rem; align-items:center; }
      .btn.primary { }
      .section { margin-top:1.5rem; }
      .badge-admin{display:none;margin-left:0.5rem;padding:0.2rem 0.6rem;border-radius:12px;background:#1f2937;color:#fff;font-size:0.85rem;}
      .admin-actions{display:flex;flex-wrap:wrap;gap:0.6rem;margin-top:0.5rem;}
      .admin-actions .btn{flex:1;min-width:180px;text-align:center;}
    </style>
    <script src="/api-config.js"></script>
  </head>
  <body>
    <header class="site-header">
      <div class="container header-inner">
        <a class="brand" href="/">LOWA</a>
        <nav class="main-nav">
          <a href="/">Accueil</a>
        </nav>
        <div class="header-actions">
          <button id="logout-btn" class="btn">Déconnexion</button>
        </div>
      </div>
    </header>

    <main class="profile-wrapper">
      <div class="profile-hero">
        <div class="avatar" id="avatar" style="position:relative;cursor:pointer" title="Cliquer pour changer l'avatar">
          <span id="avatar-text">LG</span>
          <input type="file" id="avatar-upload" accept="image/*" style="display:none" />
        </div>
        <div>
          <h1 style="margin:0">Mon profil <span id="badge-role" class="badge-admin"></span></h1>
          <div class="pill" id="member-since">Membre depuis —</div>
        </div>
        <div class="actions" style="margin-left:auto">
          <a href="/favoris.html" class="btn" style="text-decoration:none">❤️ Mes favoris</a>
        </div>
      </div>

      <div class="grid-2 section">
        <section class="card">
          <h3>Informations utilisateur</h3>
          <div id="user-info"></div>
        </section>
        <section class="card">
          <h3>🎨 Personnalisation de l'interface</h3>
          
          <!-- Theme Selection -->
          <div class="form-group">
            <label style="font-weight:bold;display:block;margin-bottom:0.5rem">Thème visuel</label>
            <div class="theme-selector">
              <button class="theme-option active" data-theme="light">☀️ Clair</button>
              <button class="theme-option" data-theme="dark">🌙 Sombre</button>
              <button class="theme-option" data-theme="temperate">🍂 Tempéré</button>
              <button class="theme-option" data-theme="auto">🌓 Auto</button>
            </div>
          </div>

          <!-- Font Size -->
          <div class="form-group" style="margin-top:1rem">
            <label for="pref-font-size" style="font-weight:bold">Taille de police</label>
            <select id="pref-font-size" style="width:100%;padding:0.5rem;margin-top:0.3rem">
              <option value="small">Petit (90%)</option>
              <option value="normal" selected>Normal (100%)</option>
              <option value="large">Grand (110%)</option>
              <option value="xlarge">Très grand (120%)</option>
            </select>
          </div>

          <!-- Spacing Density -->
          <div class="form-group" style="margin-top:1rem">
            <label for="pref-spacing" style="font-weight:bold">Densité d'espace</label>
            <select id="pref-spacing" style="width:100%;padding:0.5rem;margin-top:0.3rem">
              <option value="compact">Compact</option>
              <option value="normal" selected>Normal</option>
              <option value="comfortable">Confortable</option>
            </select>
          </div>

          <!-- Animations -->
          <label style="display:flex;gap:0.5rem;align-items:center;margin-top:1rem">
            <input type="checkbox" id="pref-animations" checked />
            <strong>Animations</strong>
          </label>

          <p id="prefs-adv-status" style="margin-top:0.5rem;color:var(--theme-text-muted);font-size:0.9rem"></p>
        </section>
      </div>

      <section class="card section">
        <h3>Préférences</h3>
        <label style="display:flex;gap:0.5rem;align-items:center">
          <input type="checkbox" id="cookie-consent" />
          Consentement aux cookies
        </label>
        <div class="form-group" style="margin-top:1rem">
          <label for="pref-lang" style="font-weight:bold;display:block;margin-bottom:0.5rem">Langue</label>
          <select id="pref-lang" style="width:100%;padding:0.5rem">
            <option value="fr" selected>🇫🇷 Français</option>
            <option value="en">🇬🇧 English</option>
          </select>
        </div>
        <label style="display:flex;gap:0.5rem;align-items:center;margin-top:0.75rem">
          <input type="checkbox" id="pref-notif" />
          Notifications email promotions
        </label>
        <button id="save-prefs" class="btn primary" style="margin-top:1rem">Enregistrer</button>
        <p id="prefs-status" style="margin-top:0.5rem;color:var(--theme-text-muted)"></p>
      </section>

      <section class="card section">
        <h3>Historique d'achats</h3>
        <div id="history"></div>
      </section>

      <section class="card section" id="admin-panel" style="display:none">
        <h3>Administration</h3>
        <p style="margin:0 0 0.5rem">Actions rapides pour les administrateurs/modérateurs.</p>
        <div class="admin-actions">
          <button class="btn" id="admin-products">Gérer les produits</button>
          <button class="btn" id="admin-stock">Gérer les stocks</button>
          <button class="btn" id="admin-roles">Gérer les rôles</button>
        </div>
      </section>
    </main>

    <script>
      const API = window.API_BASE || '/api';
      let sessionToken = null;

      // Avatar Management
      function loadAvatar() {
        const savedAvatar = localStorage.getItem('lowa_avatar');
        if (savedAvatar) {
          const avatarEl = document.getElementById('avatar');
          avatarEl.style.backgroundImage = `url(${savedAvatar})`;
          avatarEl.style.backgroundSize = 'cover';
          avatarEl.style.backgroundPosition = 'center';
          document.getElementById('avatar-text').style.display = 'none';
        }
      }

      document.getElementById('avatar').addEventListener('click', () => {
        document.getElementById('avatar-upload').click();
      });

      document.getElementById('avatar-upload').addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file && file.type.startsWith('image/')) {
          const reader = new FileReader();
          reader.onload = (event) => {
            const avatarData = event.target.result;
            localStorage.setItem('lowa_avatar', avatarData);
            loadAvatar();
          };
          reader.readAsDataURL(file);
        }
      });

      // Theme Management with Auto mode
      function initTheme() {
        const savedTheme = localStorage.getItem('lowa_theme') || 'light';
        applyTheme(savedTheme);
      }

      function applyTheme(theme) {
        if (theme === 'auto') {
          const hour = new Date().getHours();
          const actualTheme = (hour >= 20 || hour < 7) ? 'dark' : 'light';
          document.documentElement.setAttribute('data-theme', actualTheme);
        } else {
          document.documentElement.setAttribute('data-theme', theme);
        }
        localStorage.setItem('lowa_theme', theme);
        
        // Update active button
        document.querySelectorAll('.theme-option').forEach(btn => {
          if (btn.dataset.theme === theme) {
            btn.classList.add('active');
          } else {
            btn.classList.remove('active');
          }
        });
      }

      function setTheme(theme) {
        applyTheme(theme);
      }

      document.addEventListener('DOMContentLoaded', () => {
        document.querySelectorAll('.theme-option').forEach(btn => {
          btn.addEventListener('click', () => {
            setTheme(btn.dataset.theme);
            saveAdvancedPrefs();
          });
        });
        loadAvatar();
      });

      function loadSession() {
        try {
          const stored = localStorage.getItem('lowa_session');
          if (!stored) return;
          const s = JSON.parse(stored);
          sessionToken = s.token;
        } catch {}
      }

      function formatSexe(val) {
        if (val === 'H') return 'Homme';
        if (val === 'F') return 'Femme';
        return val || '-';
      }

      async function fetchUser() {
        const resp = await fetch(API + '/user', { headers: { Authorization: sessionToken } });
        if (!resp.ok) throw new Error('Not authenticated');
        const user = await resp.json();
        const initials = (user.prenom?.[0] || 'L') + (user.nom?.[0] || 'G');
        document.getElementById('avatar').textContent = initials.toUpperCase();
        document.getElementById('member-since').textContent = 'Membre depuis — ' + new Date(user.date_creation).toLocaleDateString();
        const badge = document.getElementById('badge-role');
        if (user.role && (user.role.toLowerCase() === 'admin' || user.role.toLowerCase() === 'moderator')) {
          badge.style.display = 'inline-block';
          badge.textContent = user.role.toLowerCase() === 'admin' ? 'Admin' : 'Modérateur';
          document.getElementById('admin-panel').style.display = 'block';
        }

        document.getElementById('user-info').innerHTML = `
          <div class="info-row"><strong>Nom:</strong> <span>${user.prenom} ${user.nom}</span></div>
          <div class="info-row"><strong>Email:</strong> <span>${user.email}</span></div>
          <div class="info-row"><strong>Sexe:</strong> <span>${formatSexe(user.sexe)}</span></div>
          <div class="info-row"><strong>Rôle:</strong> <span>${user.role || 'user'}</span></div>
          <div class="info-row"><strong>Créé le:</strong> <span>${new Date(user.date_creation).toLocaleString()}</span></div>
        `;
        return user;
      }

      async function fetchHistory() {
        const resp = await fetch(API + '/purchase-history', { headers: { Authorization: sessionToken } });
        if (!resp.ok) { document.getElementById('history').innerHTML = '<p>Pas d\'historique.</p>'; return; }
        const items = await resp.json();
        if (!items.length) { document.getElementById('history').innerHTML = '<p>Pas d\'historique.</p>'; return; }
        document.getElementById('history').innerHTML = items.map(i => `
          <div class="history-item" style="padding:0.5rem 0;border-bottom:1px solid var(--theme-border)">
            <div><strong>Achat du:</strong> ${new Date(i.date).toLocaleString()}</div>
            <div><strong>Total:</strong> ${i.total.toFixed(2)} €</div>
          </div>
        `).join('');
      }

      async function loadPrefs() {
        // Optionally could add GET /user-preferences; for now reflect local storage
        const consent = localStorage.getItem('lowa_cookie_consent');
        if (consent) {
          try { const obj = JSON.parse(consent); document.getElementById('cookie-consent').checked = obj.status === 'accepted'; } catch {}
        }
      }

      function loadAdvancedPrefs(){
        const lang = localStorage.getItem('lowa_pref_lang') || 'fr';
        const notif = localStorage.getItem('lowa_pref_notif') === 'true';
        const animations = localStorage.getItem('lowa_pref_animations') !== 'false';
        const theme = localStorage.getItem('lowa_theme') || 'light';
        const fontSize = localStorage.getItem('lowa_pref_font_size') || 'normal';
        const spacing = localStorage.getItem('lowa_pref_spacing') || 'normal';
        
        document.getElementById('pref-lang').value = lang;
        document.getElementById('pref-notif').checked = notif;
        document.getElementById('pref-animations').checked = animations;
        document.getElementById('pref-font-size').value = fontSize;
        document.getElementById('pref-spacing').value = spacing;
        
        // Set active theme button
        document.querySelectorAll('.theme-option').forEach(btn => {
          if (btn.dataset.theme === theme) {
            btn.classList.add('active');
          }
        });

        // Apply font size
        applyFontSize(fontSize);
        applySpacing(spacing);
      }

      function applyFontSize(size) {
        const sizes = { small: '90%', normal: '100%', large: '110%', xlarge: '120%' };
        document.documentElement.style.setProperty('--font-scale', sizes[size] || '100%');
        if (document.body.style.fontSize === '') {
          document.body.style.fontSize = sizes[size] || '100%';
        }
      }

      function applySpacing(spacing) {
        const spacings = {
          compact: '0.75',
          normal: '1',
          comfortable: '1.25'
        };
        const scale = spacings[spacing] || '1';
        document.documentElement.style.setProperty('--spacing-scale', scale);
      }

      function saveAdvancedPrefs(){
        const lang = document.getElementById('pref-lang').value;
        const notif = document.getElementById('pref-notif').checked;
        const animations = document.getElementById('pref-animations').checked;
        const theme = document.documentElement.getAttribute('data-theme');
        const fontSize = document.getElementById('pref-font-size').value;
        const spacing = document.getElementById('pref-spacing').value;
        
        localStorage.setItem('lowa_pref_lang', lang);
        localStorage.setItem('lowa_pref_notif', notif);
        localStorage.setItem('lowa_pref_animations', animations);
        localStorage.setItem('lowa_theme', theme);
        localStorage.setItem('lowa_pref_font_size', fontSize);
        localStorage.setItem('lowa_pref_spacing', spacing);
        
        // Apply animations preference
        if (!animations) {
          document.documentElement.style.setProperty('--transition-fast', '0s');
          document.documentElement.style.setProperty('--transition-medium', '0s');
        } else {
          document.documentElement.style.removeProperty('--transition-fast');
          document.documentElement.style.removeProperty('--transition-medium');
        }

        // Apply font size and spacing
        applyFontSize(fontSize);
        applySpacing(spacing);
        
        document.getElementById('prefs-adv-status').textContent = '✅ Préférences enregistrées';
        setTimeout(() => {
          document.getElementById('prefs-adv-status').textContent = '';
        }, 3000);
      }

      async function savePrefs() {
        const status = document.getElementById('cookie-consent').checked ? 'accepted' : 'declined';
        const resp = await fetch(API + '/user-preferences', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', Authorization: sessionToken },
          body: JSON.stringify({ cookie_consent: status })
        });
        if (!resp.ok) throw new Error('Save failed');
        document.getElementById('prefs-status').textContent = 'Préférences enregistrées';
        setTimeout(() => {
          document.getElementById('prefs-status').textContent = '';
        }, 3000);
      }

      document.getElementById('save-prefs').addEventListener('click', async () => {
        try { await savePrefs(); } catch (e) { alert('Erreur: ' + e.message); }
      });

      document.getElementById('pref-lang').addEventListener('change', saveAdvancedPrefs);
      document.getElementById('pref-notif').addEventListener('change', saveAdvancedPrefs);
      document.getElementById('pref-animations').addEventListener('change', saveAdvancedPrefs);
      document.getElementById('pref-font-size').addEventListener('change', saveAdvancedPrefs);
      document.getElementById('pref-spacing').addEventListener('change', saveAdvancedPrefs);

      document.getElementById('logout-btn').addEventListener('click', async () => {
        try { await fetch(API + '/logout', { method: 'POST', headers: { Authorization: sessionToken } }); } catch {}
        localStorage.removeItem('lowa_session');
        window.location.href = '/';
      });

      document.getElementById('logout-btn-hero').addEventListener('click', async () => {
        try { await fetch(API + '/logout', { method: 'POST', headers: { Authorization: sessionToken } }); } catch {}
        localStorage.removeItem('lowa_session');
        window.location.href = '/';
      });

      (async function init() {
        initTheme();
        loadSession();
        try {
          await fetchUser();
          await fetchHistory();
          await loadPrefs();
          loadAdvancedPrefs();
        } catch (e) {
          alert('Veuillez vous connecter');
          window.location.href = '/';
        }
      })();
    </script>
  </body>
</html>
