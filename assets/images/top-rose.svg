<svg viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="600" fill="#f0f5f0"/>
  <defs>
    <linearGradient id="topGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0d0d8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e8b8c8;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Top body -->
  <path d="M 160 120 L 190 150 L 180 380 L 100 360 L 80 150 Z" fill="url(#topGrad)" stroke="#c9999a" stroke-width="2"/>
  <path d="M 440 120 L 410 150 L 420 380 L 500 360 L 520 150 Z" fill="url(#topGrad)" stroke="#c9999a" stroke-width="2"/>
  <!-- Straps -->
  <rect x="200" y="110" width="18" height="60" rx="9" fill="url(#topGrad)" stroke="#c9999a" stroke-width="2"/>
  <rect x="382" y="110" width="18" height="60" rx="9" fill="url(#topGrad)" stroke="#c9999a" stroke-width="2"/>
  <!-- Neckline -->
  <path d="M 260 120 Q 300 90 340 120" fill="none" stroke="#c9999a" stroke-width="2" stroke-linecap="round"/>
  <!-- Hem -->
  <path d="M 180 380 Q 300 390 420 380" fill="none" stroke="#c9999a" stroke-width="2"/>
  <!-- Texture -->
  <circle cx="250" cy="220" r="5" fill="#d9999a" opacity="0.3"/>
  <circle cx="350" cy="240" r="5" fill="#d9999a" opacity="0.3"/>
  <circle cx="300" cy="300" r="4" fill="#d9999a" opacity="0.3"/>
</svg>