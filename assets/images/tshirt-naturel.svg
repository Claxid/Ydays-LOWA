<svg viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="600" fill="#f0f5f0"/>
  <defs>
    <linearGradient id="tshirtGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f5f5f0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e8e8e0;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- T-shirt shape -->
  <path d="M 150 100 L 200 120 L 220 180 L 220 450 Q 220 480 200 490 L 100 490 Q 80 480 80 450 L 80 180 L 100 120 Z" fill="url(#tshirtGrad)" stroke="#999" stroke-width="2"/>
  <path d="M 450 100 L 400 120 L 380 180 L 380 450 Q 380 480 400 490 L 500 490 Q 520 480 520 450 L 520 180 L 500 120 Z" fill="url(#tshirtGrad)" stroke="#999" stroke-width="2"/>
  <!-- Sleeves -->
  <ellipse cx="60" cy="160" rx="35" ry="25" fill="url(#tshirtGrad)" stroke="#999" stroke-width="2"/>
  <ellipse cx="540" cy="160" rx="35" ry="25" fill="url(#tshirtGrad)" stroke="#999" stroke-width="2"/>
  <!-- Collar -->
  <ellipse cx="300" cy="110" rx="40" ry="30" fill="url(#tshirtGrad)" stroke="#999" stroke-width="2"/>
