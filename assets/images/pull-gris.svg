  <!-- Texture -->
  <circle cx="200" cy="200" r="8" fill="#999" opacity="0.3"/>
  <circle cx="350" cy="250" r="6" fill="#999" opacity="0.3"/>
  <circle cx="150" cy="350" r="7" fill="#999" opacity="0.3"/>
