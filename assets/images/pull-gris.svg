  <!-- Sweater body -->
  <path d="M 150 80 L 200 100 L 210 180 L 210 500 Q 210 530 190 540 L 110 540 Q 90 530 90 500 L 90 180 L 100 100 Z" fill="url(#pullGrad)" stroke="#666" stroke-width="2"/>
  <path d="M 450 80 L 400 100 L 390 180 L 390 500 Q 390 530 410 540 L 490 540 Q 510 530 510 500 L 510 180 L 500 100 Z" fill="url(#pullGrad)" stroke="#666" stroke-width="2"/>
