<svg viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="600" fill="#f0f5f0"/>
  <defs>
    <linearGradient id="pantGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#b8a460;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9d8a4f;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Waistband -->
  <ellipse cx="300" cy="80" rx="90" ry="25" fill="#8b7a42" stroke="#666" stroke-width="2"/>
  <!-- Left leg -->
  <path d="M 220 100 L 210 500 L 210 540 L 270 540 L 280 100 Z" fill="url(#pantGrad)" stroke="#666" stroke-width="2"/>
  <!-- Right leg -->
  <path d="M 380 100 L 390 500 L 390 540 L 330 540 L 320 100 Z" fill="url(#pantGrad)" stroke="#666" stroke-width="2"/>
  <!-- Belt -->
  <rect x="220" y="70" width="160" height="25" fill="#8b7a42" stroke="#555" stroke-width="1.5"/>
  <!-- Pockets -->
  <rect x="235" y="150" width="20" height="30" fill="none" stroke="#666" stroke-width="1"/>
  <rect x="345" y="150" width="20" height="30" fill="none" stroke="#666" stroke-width="1"/>
  <!-- Seams -->
  <line x1="300" y1="100" x2="300" y2="520" stroke="#8b7a42" stroke-width="1.5" opacity="0.5"/>
</svg>