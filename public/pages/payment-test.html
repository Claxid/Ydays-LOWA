<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Configuration LOWA Paiement</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f5f5;
      padding: 2rem;
    }
    .container { max-width: 800px; margin: 0 auto; background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    h1 { color: #333; margin-bottom: 1rem; }
    .test-item {
      padding: 1rem;
      margin: 1rem 0;
      border-left: 4px solid #ddd;
      background: #f9f9f9;
      border-radius: 4px;
    }
    .test-item.pass {
      border-left-color: #4caf50;
      background: #f1f8f4;
    }
    .test-item.fail {
      border-left-color: #f44336;
      background: #fef5f5;
    }
    .test-item.loading {
      border-left-color: #2196f3;
      background: #f5f9ff;
    }
    .status {
      display: inline-block;
      padding: 0.25rem 0.75rem;
      border-radius: 4px;
      font-weight: 600;
      font-size: 0.85rem;
      margin-right: 0.5rem;
    }
    .status.pass { background: #4caf50; color: white; }
    .status.fail { background: #f44336; color: white; }
    .status.loading { background: #2196f3; color: white; }
    .status.warning { background: #ff9800; color: white; }
    .message { margin-top: 0.5rem; font-size: 0.9rem; color: #666; }
    .code { background: #f4f4f4; padding: 0.5rem; border-radius: 4px; font-family: monospace; font-size: 0.9rem; margin: 0.5rem 0; }
    button {
      background: #2196f3;
      color: white;
      border: none;
      padding: 0.75rem 1.5rem;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 600;
      margin-top: 1rem;
    }
    button:hover { background: #1976d2; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔧 Test Configuration Paiement LOWA</h1>
    
    <div id="tests"></div>

    <button onclick="location.reload()">Réessayer</button>
    <button onclick="runTests()" style="margin-left: 0.5rem;">Relancer les tests</button>
  </div>

  <script>
    const tests = [
      {
        name: '📦 Panier localStorage',
        async run() {
          const cart = localStorage.getItem('lowa_cart') || localStorage.getItem('Lowa_cart');
          if (cart) {
            const items = JSON.parse(cart);
            return { pass: true, message: `${items.length} article(s) trouvé(s)` };
          }
          return { pass: false, message: 'Panier vide ou clé manquante' };
        }
      },
      {
        name: '🔑 Configuration Stripe',
        async run() {
          try {
            const res = await fetch('/api/stripe/config');
            const data = await res.json();
            
            if (res.ok && data.publicKey) {
              const masked = data.publicKey.substring(0, 20) + '...';
              return { pass: true, message: `Clé: ${masked}` };
            } else if (data.error) {
              return { pass: false, message: data.error };
            } else {
              return { pass: false, message: 'Réponse invalide' };
            }
          } catch (e) {
            return { pass: false, message: e.message };
          }
        }
      },
      {
        name: '💳 Création PaymentIntent',
        async run() {
          try {
            const res = await fetch('/api/stripe/create-intent', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ amount: 1000 }) // €10
            });
            const data = await res.json();
            
            if (res.ok && data.clientSecret) {
              return { pass: true, message: 'Intent créée avec succès' };
            } else if (data.error) {
              return { pass: false, message: data.error };
            } else {
              return { pass: false, message: 'Erreur inconnue' };
            }
          } catch (e) {
            return { pass: false, message: e.message };
          }
        }
      },
      {
        name: '🌐 Chargement SDK Stripe',
        async run() {
          try {
            // Vérifier si Stripe peut être chargé
            const script = document.createElement('script');
            script.src = 'https://js.stripe.com/v3/';
            script.async = true;
            
            return new Promise((resolve) => {
              script.onload = () => {
                if (window.Stripe) {
                  resolve({ pass: true, message: 'SDK Stripe disponible' });
                } else {
                  resolve({ pass: false, message: 'SDK chargé mais pas initialisé' });
                }
              };
              script.onerror = () => {
                resolve({ pass: false, message: 'Impossible de charger le SDK' });
              };
              document.head.appendChild(script);
            });
          } catch (e) {
            return { pass: false, message: e.message };
          }
        }
      },
      {
        name: '🔗 Connexion réseau',
        async run() {
          try {
            const res = await fetch('/index.html', { method: 'HEAD' });
            return { pass: res.ok, message: res.ok ? 'Serveur accessible' : 'Erreur serveur' };
          } catch (e) {
            return { pass: false, message: e.message };
          }
        }
      }
    ];

    async function runTests() {
      const container = document.getElementById('tests');
      container.innerHTML = '';

      for (const test of tests) {
        const item = document.createElement('div');
        item.className = 'test-item loading';
        item.innerHTML = `
          <span class="status loading">⏳</span>
          <strong>${test.name}</strong>
          <div class="message">Test en cours...</div>
        `;
        container.appendChild(item);

        try {
          const result = await test.run();
          item.className = `test-item ${result.pass ? 'pass' : 'fail'}`;
          item.innerHTML = `
            <span class="status ${result.pass ? 'pass' : 'fail'}">
              ${result.pass ? '✓' : '✗'}
            </span>
            <strong>${test.name}</strong>
            <div class="message">${result.message}</div>
          `;
        } catch (e) {
          item.className = 'test-item fail';
          item.innerHTML = `
            <span class="status fail">✗</span>
            <strong>${test.name}</strong>
            <div class="message">Erreur: ${e.message}</div>
          `;
        }
      }

      // Ajouter un résumé
      const summary = document.createElement('div');
      summary.style.marginTop = '2rem';
      summary.style.padding = '1rem';
      summary.style.borderRadius = '4px';
      summary.style.background = '#f0f0f0';
      
      const passed = container.querySelectorAll('.pass').length;
      const failed = container.querySelectorAll('.fail').length;
      
      summary.innerHTML = `
        <strong>Résumé:</strong> ${passed} réussi(s), ${failed} échoué(s)
        ${failed > 0 ? '<div style="color: #f44336; margin-top: 0.5rem;">⚠️ Voir PAYMENT_SETUP.md pour le dépannage</div>' : '<div style="color: #4caf50; margin-top: 0.5rem;">✓ Configuration OK!</div>'}
      `;
      container.appendChild(summary);
    }

    // Lancer les tests au chargement
    runTests();
  </script>
</body>
</html>
