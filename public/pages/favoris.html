<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mes Favoris — LOWA</title>
    <!-- Google Fonts - Typography LOWA -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&family=Lora:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/public/css/homepage.css">
</head>
<body>
    <header class="site-header">
        <div class="container header-inner">
            <a class="brand" href="/index.html">LOWA</a>
            <button class="burger" id="burger-btn" aria-label="Ouvrir le menu">Menu</button>
            <nav class="main-nav">
                <a href="/index.html">Accueil</a>
                <a href="/public/pages/profile.html">Mon profil</a>
            </nav>
            <div class="header-actions">
                <button id="theme-toggle" class="theme-btn" aria-label="Changer de thème">Theme</button>
                <button id="cart-button" class="cart-btn">
                    Panier (<span id="cart-count">0</span>)
                </button>
            </div>
        </div>
    </header>

    <main>
        <section class="container products-section">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:2rem">
                <h2>Mes Favoris</h2>
                <button id="clear-favorites" class="btn" style="background:transparent;border:2px solid var(--accent);color:var(--accent)">Tout supprimer</button>
            </div>

            <div id="favorites-empty" class="products-empty" style="display:none">
                <p style="font-size:1.2rem;margin-bottom:1rem">Aucun favori pour le moment</p>
                <p style="color:var(--muted)">Parcourez notre catalogue et cliquez sur Favoris pour ajouter des produits ici !</p>
                <a href="/index.html" class="btn primary" style="margin-top:1rem;text-decoration:none;display:inline-block">Découvrir les produits</a>
            </div>

            <div id="favorites-grid" class="products-grid"></div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>&copy; <span id="year"></span> LOWA — Tous droits réservés.</p>
        </div>
    </footer>

    <script src="/public/js/common.js"></script>

    <!-- Cart modal -->
    <div id="cart-modal" class="cart-modal" aria-hidden="true">
        <div class="cart-panel" role="dialog" aria-label="Panier">
            <button id="close-cart" class="close-cart" aria-label="Fermer le panier">×</button>
            <h3>Votre panier</h3>
            <div id="cart-items" class="cart-items"></div>
            <div class="cart-footer">
                <div class="cart-total">Total : <span id="cart-total">0.00</span> €</div>
                <div class="cart-actions">
                    <button id="clear-cart" class="btn">Vider</button>
                    <button id="checkout" class="btn primary">Passer à la caisse</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('year').textContent = new Date().getFullYear();

        function favoritesScopedGet(baseKey) {
            if (typeof scopedStorageGet === 'function') return scopedStorageGet(baseKey);
            return localStorage.getItem(baseKey);
        }

        function favoritesScopedSet(baseKey, value) {
            if (typeof scopedStorageSet === 'function') {
                scopedStorageSet(baseKey, value);
                return;
            }
            localStorage.setItem(baseKey, value);
        }

        const favoritesGrid = document.getElementById('favorites-grid');
        const favoritesEmpty = document.getElementById('favorites-empty');
        const FAVORITES_KEY = 'lowa_favorites';
        const FALLBACK_PRODUCTS = [
            {"id":1,"name":"T-shirt BIO - Naturel","price":29.00,"description":"T-shirt en coton biologique certifié. Coupe confortable, coloris naturels.","image":"/public/images/tshirt-naturel.svg","category":"hommes","subcategory":"t-shirts","collection":"eco"},
            {"id":2,"name":"Pull recyclé - Gris","price":79.00,"description":"Pull fabriqué à partir de fibres recyclées. Chaud et durable.","image":"/public/images/pull-gris.svg","category":"hommes","subcategory":"vestes","collection":"recycle"},
            {"id":3,"name":"Pantalon éco - Kaki","price":59.00,"description":"Pantalon en tissu certifié avec renforts minimalistes.","image":"/public/images/pantalon-kaki.svg","category":"hommes","subcategory":"pantalons","collection":"eco"},
            {"id":4,"name":"Veste en Lin - Beige","price":89.00,"description":"Veste légère en lin naturel, parfaite pour la mi-saison. Coupe ajustée.","image":"/public/images/veste-lin-beige.svg","category":"femmes","subcategory":"vestes","collection":"classiques"},
            {"id":5,"name":"Robe d'été - Blanc cassé","price":65.00,"description":"Robe fluide en coton bio, idéale pour l'été. Fabrication locale.","image":"/public/images/robe-ete.svg","category":"femmes","subcategory":"robes","collection":"eco"},
            {"id":6,"name":"Top en fibres recyclées - Rose","price":35.00,"description":"Top féminin fabriqué à partir de bouteilles plastiques recyclées.","image":"/public/images/top-rose.svg","category":"femmes","subcategory":"tops","collection":"recycle"},
            {"id":7,"name":"Jupe midi - Marine","price":55.00,"description":"Jupe mi-longue en coton bio certifié GOTS. Coupe élégante.","image":"/public/images/jupe-marine.svg","category":"femmes","subcategory":"robes","collection":"classiques"},
            {"id":8,"name":"Chemise lin - Blanc","price":49.00,"description":"Chemise intemporelle en lin français. Production éthique.","image":"/public/images/chemise-lin.svg","category":"hommes","subcategory":"t-shirts","collection":"classiques"},
            {"id":9,"name":"Sac en toile recyclée - Noir","price":25.00,"description":"Sac cabas en toile recyclée, résistant et pratique au quotidien.","image":"/public/images/sac-recyc.svg","category":"femmes","subcategory":"accessoires","collection":"recycle"},
            {"id":10,"name":"Écharpe en laine bio - Camel","price":39.00,"description":"Écharpe douce en laine biologique. Teinture végétale.","image":"/public/images/echarpe.svg","category":"femmes","subcategory":"accessoires","collection":"eco"},
            {"id":11,"name":"Pantalon chino - Sable","price":69.00,"description":"Chino en coton bio, coupe moderne et confortable.","image":"/public/images/chino-sable.svg","category":"hommes","subcategory":"pantalons","collection":"classiques"},
            {"id":12,"name":"Blouson recyclé - Bleu nuit","price":95.00,"description":"Blouson fabriqué à partir de fibres recyclées. Design urbain.","image":"/public/images/blouson-bleu.svg","category":"hommes","subcategory":"vestes","collection":"recycle"},
            {"id":13,"name":"Sweat organique - Écru","price":59.00,"description":"Sweat doux en coton organique, intérieur gratté, coupe unisexe.","image":"/public/images/pull-gris.svg","category":"hommes","subcategory":"t-shirts","collection":"eco"},
            {"id":14,"name":"Parka imperméable recyclée","price":129.00,"description":"Parka longue, membrane recyclée, coutures étanchées, capuche ajustable.","image":"/public/images/blouson-bleu.svg","category":"femmes","subcategory":"vestes","collection":"recycle"},
            {"id":15,"name":"Cardigan laine bio - Olive","price":72.00,"description":"Cardigan en laine biologique, maille perlée, boutons en corozo.","image":"/public/images/veste-lin-beige.svg","category":"femmes","subcategory":"vestes","collection":"classiques"},
            {"id":16,"name":"Short en coton bio - Sable","price":39.00,"description":"Short léger en sergé de coton bio, taille ajustable, poches latérales.","image":"/public/images/chino-sable.svg","category":"hommes","subcategory":"pantalons","collection":"eco"},
            {"id":17,"name":"Robe cache-cœur - Terracotta","price":79.00,"description":"Robe cache-cœur en viscose EcoVero, ceinture à nouer, manches 3/4.","image":"/public/images/robe-ete.svg","category":"femmes","subcategory":"robes","collection":"classiques"},
            {"id":18,"name":"Doudoune légère recyclée","price":139.00,"description":"Doudoune compressible en fibres recyclées, chaleur 4 saisons.","image":"/public/images/blouson-bleu.svg","category":"hommes","subcategory":"vestes","collection":"recycle"}
        ];
        let favorites = [];
        function loadFavoritesFromStorage() {
            try {
                const raw = favoritesScopedGet(FAVORITES_KEY);
                const arr = raw ? JSON.parse(raw) : [];
                favorites = Array.from(new Set(arr.map(v => parseInt(v, 10)).filter(n => Number.isFinite(n))));
                favoritesScopedSet(FAVORITES_KEY, JSON.stringify(favorites));
            } catch (e) {
                favorites = [];
                favoritesScopedSet(FAVORITES_KEY, JSON.stringify(favorites));
            }
        }
        loadFavoritesFromStorage();

        function requireAuth(reason) {
            try {
                const session = JSON.parse(localStorage.getItem('lowa_session') || 'null');
                if (session && session.user) return true;
            } catch (e) {}
            if (reason) {
                alert(reason);
            }
            const redirectTarget = encodeURIComponent(window.location.pathname + window.location.search);
            window.location.href = `/index.html?auth=login&redirect=${redirectTarget}`;
            return false;
        }

        let allProducts = [];

        // Theme Management
        function initTheme() {
            const savedTheme = favoritesScopedGet('lowa_theme') || 'light';
            setTheme(savedTheme);
        }

        function setTheme(theme) {
            if (theme === 'auto') {
                const hour = new Date().getHours();
                const actualTheme = (hour >= 20 || hour < 7) ? 'dark' : 'light';
                document.documentElement.setAttribute('data-theme', actualTheme);
            } else {
                document.documentElement.setAttribute('data-theme', theme);
            }
            favoritesScopedSet('lowa_theme', theme);
            updateThemeEmoji();
        }

        function updateThemeEmoji() {
            const themeToggle = document.getElementById('theme-toggle');
            const theme = document.documentElement.getAttribute('data-theme');
            if (theme === 'dark') {
                themeToggle.textContent = 'Clair';
            } else {
                themeToggle.textContent = '🌆';
            }
        }

        document.getElementById('theme-toggle').addEventListener('click', () => {
            const currentTheme = favoritesScopedGet('lowa_theme') || 'light';
            let nextTheme = 'light';
            if (currentTheme === 'light') nextTheme = 'dark';
            else if (currentTheme === 'dark') nextTheme = 'temperate';
            else nextTheme = 'light';
            setTheme(nextTheme);
        });

        initTheme();

        // Fetch helper with timeout to éviter blocage spinner
        async function fetchWithTimeout(url, ms = 3000) {
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), ms);
            try {
                const res = await fetch(url, { cache: 'no-cache', signal: controller.signal });
                return res;
            } finally {
                clearTimeout(timer);
            }
        }

        // Load products and filter favorites
        async function loadFavorites() {
            const paths = [
                'https://lowa-api.onrender.com/api/products',
                '/data/products.json?v=14',
                './data/products.json?v=14',
                '/public/data/products.json?v=14',
                './public/data/products.json?v=14',
                'https://raw.githubusercontent.com/Claxid/Ydays-LOWA/main/public/data/products.json'
            ];
            let response = null;
            for (const url of paths) {
                try {
                    const timeoutMs = url.includes('onrender') ? 3000 : 2000;
                    const res = await fetchWithTimeout(url, timeoutMs);
                    if (!res.ok) throw new Error(`HTTP ${res.status}`);
                    response = res;
                    break;
                } catch (e) {
                    console.warn('Échec chargement', url, e.message);
                }
            }

            if (!response) {
                console.error('Impossible de charger les produits favoris, fallback local');
                allProducts = FALLBACK_PRODUCTS;
                console.log('Utilisation du FALLBACK_PRODUCTS (favoris)');
                // Continue to render with fallback
            }

            try {
                if (response) {
                    allProducts = await response.json();
                }
            } catch (e) {
                console.error('JSON invalide pour les produits favoris', e);
                allProducts = FALLBACK_PRODUCTS;
            }
            console.log('Favoris chargés:', favorites);
            console.log('Produits dispo:', allProducts?.length);
            renderFavorites();
        }

        function renderFavorites() {
            if (favorites.length === 0) {
                favoritesEmpty.style.display = 'block';
                favoritesGrid.style.display = 'none';
                return;
            }

            favoritesEmpty.style.display = 'none';
            favoritesGrid.style.display = 'grid';

            const favoriteProducts = allProducts.filter(p => favorites.includes(parseInt(p.id, 10)));
            
            if (favoriteProducts.length === 0) {
                favoritesEmpty.style.display = 'block';
                favoritesGrid.style.display = 'none';
                return;
            }
            
            favoritesGrid.innerHTML = favoriteProducts.map(product => {
                const formatPrice = (v) => {
                    const n = typeof v === 'number' ? v : parseFloat(v);
                    return isFinite(n) ? n.toFixed(2) : '0.00';
                };
                const collectionLabels = {
                    'eco': 'Éco',
                    'recycle': 'Recyclé',
                    'classiques': 'Classique'
                };
                return `
                <article class="product" data-id="${product.id}" data-collection="${collectionLabels[product.collection] || product.collection}">
                    <div class="product-image-container">
                        <img src="${product.image}" alt="${product.name}" loading="lazy" width="280" height="280" onerror="window.lowaImgFallback(this)" />
                        <button class="fav-btn active" data-id="${product.id}" aria-label="Retirer des favoris" title="Retirer des favoris">Favoris</button>
                    </div>
                    <h3>${product.name}</h3>
                    <p>${product.description}</p>
                    <div class="meta">
                        <span class="product-price">${formatPrice(product.price)} €</span>
                        <button class="btn primary add-to-cart" data-id="${product.id}" data-name="${product.name}" data-price="${product.price}">Ajouter</button>
                    </div>
                </article>`;
            }).join('');

            attachFavoriteListeners();
            attachCartListeners();
        }

        function toggleFavorite(productId) {
            const idNum = parseInt(productId, 10);
            const index = favorites.indexOf(idNum);
            if (index > -1) {
                favorites.splice(index, 1);
            } else {
                favorites.push(idNum);
            }
            favorites = Array.from(new Set(favorites));
            favoritesScopedSet(FAVORITES_KEY, JSON.stringify(favorites));
        }

        function attachFavoriteListeners() {
            document.querySelectorAll('.fav-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    if (!requireAuth('Connectez-vous ou créez un compte pour gérer vos favoris.')) {
                        return;
                    }
                    const productId = e.target.dataset.id;
                    toggleFavorite(productId);
                    // Remove from view
                    renderFavorites();
                });
            });
        }

        // Clear all favorites
        document.getElementById('clear-favorites').addEventListener('click', () => {
            if (!requireAuth('Connectez-vous ou créez un compte pour gérer vos favoris.')) {
                return;
            }
            if (confirm('Voulez-vous vraiment supprimer tous vos favoris ?')) {
                favorites = [];
                favoritesScopedSet(FAVORITES_KEY, JSON.stringify(favorites));
                renderFavorites();
            }
        });

        // Cart Management
        const CART_KEY = 'lowa_cart';
        const rawCart = favoritesScopedGet(CART_KEY);
        let cart = rawCart ? JSON.parse(rawCart) : [];
        const cartButton = document.getElementById('cart-button');
        const cartCount = document.getElementById('cart-count');
        const cartModal = document.getElementById('cart-modal');
        const closeCartBtn = document.getElementById('close-cart');
        const cartItemsDiv = document.getElementById('cart-items');
        const cartTotalSpan = document.getElementById('cart-total');
        const clearCartBtn = document.getElementById('clear-cart');
        const checkoutBtn = document.getElementById('checkout');

        function updateCartUI() {
            cartCount.textContent = cart.length;
            cartItemsDiv.innerHTML = cart.map((item, idx) => `
                <div class="cart-item">
                    <img src="${item.image}" alt="${item.name}" width="60" height="60" />
                    <div class="info">
                        <h4>${item.name}</h4>
                        <p>${item.price.toFixed(2)} €</p>
                    </div>
                    <button class="btn" onclick="window.removeFromCart(${idx})" style="padding: 0.4rem 0.6rem; font-size: 0.85rem;">×</button>
                </div>
            `).join('');
            const total = cart.reduce((sum, item) => sum + item.price, 0);
            cartTotalSpan.textContent = total.toFixed(2);
            favoritesScopedSet(CART_KEY, JSON.stringify(cart));
        }

        function attachCartListeners() {
            document.querySelectorAll('.add-to-cart').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    if (!requireAuth('Connectez-vous ou créez un compte pour ajouter des articles au panier.')) {
                        return;
                    }
                    const productId = e.target.dataset.id;
                    const product = document.querySelector(`[data-id="${productId}"]`);
                    if (!product) return;
                    const img = product.querySelector('img');
                    cart.push({
                        id: productId,
                        name: e.target.dataset.name,
                        price: parseFloat(e.target.dataset.price),
                        image: img.src
                    });
                    updateCartUI();
                    e.target.textContent = '✓ Ajouté';
                    setTimeout(() => { e.target.textContent = 'Ajouter'; }, 1500);
                });
            });
        }

        window.removeFromCart = function(idx) {
            cart.splice(idx, 1);
            updateCartUI();
        };

        cartButton.addEventListener('click', () => {
            cartModal.setAttribute('aria-hidden', 'false');
        });
        closeCartBtn.addEventListener('click', () => {
            cartModal.setAttribute('aria-hidden', 'true');
        });
        cartModal.addEventListener('click', (e) => {
            if (e.target === cartModal) {
                cartModal.setAttribute('aria-hidden', 'true');
            }
        });
        clearCartBtn.addEventListener('click', () => {
            cart = [];
            updateCartUI();
        });
        checkoutBtn.addEventListener('click', () => {
            if (cart.length === 0) {
                alert('Votre panier est vide');
                return;
            }
            alert(`Commande de ${cart.length} article(s) pour ${cartTotalSpan.textContent} €\nRedirection vers le paiement...`);
            cart = [];
            updateCartUI();
            cartModal.setAttribute('aria-hidden', 'true');
        });

        // Burger menu
        const burgerBtn = document.getElementById('burger-btn');
        const headerEl = document.querySelector('.site-header');
        burgerBtn?.addEventListener('click', () => {
            const open = headerEl.classList.toggle('menu-open');
            burgerBtn.setAttribute('aria-expanded', open);
        });

        // Initialize
        updateCartUI();
        loadFavorites();
    </script>
</body>
</html>
