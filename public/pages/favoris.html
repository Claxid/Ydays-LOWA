<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mes Favoris — LOWA</title>
    <link rel="stylesheet" href="/public/css/homepage.css">
</head>
<body>
    <header class="site-header">
        <div class="container header-inner">
            <a class="brand" href="/index.html">🌿 LOWA</a>
            <button class="burger" id="burger-btn" aria-label="Ouvrir le menu">☰</button>
            <nav class="main-nav">
                <a href="/index.html">Accueil</a>
                <a href="/public/pages/profile.html">Mon profil</a>
            </nav>
            <div class="header-actions">
                <button id="theme-toggle" class="theme-btn" aria-label="Changer de thème">🌙</button>
                <button id="cart-button" class="cart-btn">
                    Panier (<span id="cart-count">0</span>)
                </button>
            </div>
        </div>
    </header>

    <main>
        <section class="container products-section">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:2rem">
                <h2>❤️ Mes Favoris</h2>
                <button id="clear-favorites" class="btn" style="background:transparent;border:2px solid var(--accent);color:var(--accent)">Tout supprimer</button>
            </div>

            <div id="favorites-empty" class="products-empty" style="display:none">
                <p style="font-size:1.2rem;margin-bottom:1rem">Aucun favori pour le moment</p>
                <p style="color:var(--muted)">Parcourez notre catalogue et cliquez sur ❤️ pour ajouter des produits ici !</p>
                <a href="/index.html" class="btn primary" style="margin-top:1rem;text-decoration:none;display:inline-block">Découvrir les produits</a>
            </div>

            <div id="favorites-grid" class="products-grid"></div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>&copy; <span id="year"></span> LOWA — Tous droits réservés.</p>
        </div>
    </footer>

    <!-- Cart modal -->
    <div id="cart-modal" class="cart-modal" aria-hidden="true">
        <div class="cart-panel" role="dialog" aria-label="Panier">
            <button id="close-cart" class="close-cart" aria-label="Fermer le panier">×</button>
            <h3>Votre panier</h3>
            <div id="cart-items" class="cart-items"></div>
            <div class="cart-footer">
                <div class="cart-total">Total : <span id="cart-total">0.00</span> €</div>
                <div class="cart-actions">
                    <button id="clear-cart" class="btn">Vider</button>
                    <button id="checkout" class="btn primary">Passer à la caisse</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('year').textContent = new Date().getFullYear();

        const favoritesGrid = document.getElementById('favorites-grid');
        const favoritesEmpty = document.getElementById('favorites-empty');
        const FAVORITES_KEY = 'lowa_favorites';
        let favorites = [];
        function loadFavoritesFromStorage() {
            try {
                const raw = localStorage.getItem(FAVORITES_KEY);
                const arr = raw ? JSON.parse(raw) : [];
                favorites = Array.from(new Set(arr.map(v => parseInt(v, 10)).filter(n => Number.isFinite(n))));
                localStorage.setItem(FAVORITES_KEY, JSON.stringify(favorites));
            } catch (e) {
                favorites = [];
                localStorage.setItem(FAVORITES_KEY, JSON.stringify(favorites));
            }
        }
        loadFavoritesFromStorage();
        let allProducts = [];

        // Theme Management
        function initTheme() {
            const savedTheme = localStorage.getItem('lowa_theme') || 'light';
            setTheme(savedTheme);
        }

        function setTheme(theme) {
            if (theme === 'auto') {
                const hour = new Date().getHours();
                const actualTheme = (hour >= 20 || hour < 7) ? 'dark' : 'light';
                document.documentElement.setAttribute('data-theme', actualTheme);
            } else {
                document.documentElement.setAttribute('data-theme', theme);
            }
            localStorage.setItem('lowa_theme', theme);
            updateThemeEmoji();
        }

        function updateThemeEmoji() {
            const themeToggle = document.getElementById('theme-toggle');
            const theme = document.documentElement.getAttribute('data-theme');
            if (theme === 'dark') {
                themeToggle.textContent = '☀️';
            } else {
                themeToggle.textContent = '🌆';
            }
        }

        document.getElementById('theme-toggle').addEventListener('click', () => {
            const currentTheme = localStorage.getItem('lowa_theme') || 'light';
            let nextTheme = 'light';
            if (currentTheme === 'light') nextTheme = 'dark';
            else if (currentTheme === 'dark') nextTheme = 'temperate';
            else nextTheme = 'light';
            setTheme(nextTheme);
        });

        initTheme();

        // Fetch helper with timeout to éviter blocage spinner
        async function fetchWithTimeout(url, ms = 3000) {
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), ms);
            try {
                const res = await fetch(url, { cache: 'no-cache', signal: controller.signal });
                return res;
            } finally {
                clearTimeout(timer);
            }
        }

        // Load products and filter favorites
        async function loadFavorites() {
            const paths = [
                '/data/products.json?v=13',
                './data/products.json?v=13',
                '/public/data/products.json?v=13',
                './public/data/products.json?v=13',
                'https://raw.githubusercontent.com/Claxid/Ydays-LOWA/main/public/data/products.json',
                'https://lowa-api.onrender.com/api/products'
            ];
            let response = null;
            for (const url of paths) {
                try {
                    const timeoutMs = url.includes('onrender') ? 3000 : 2000;
                    const res = await fetchWithTimeout(url, timeoutMs);
                    if (!res.ok) throw new Error(`HTTP ${res.status}`);
                    response = res;
                    break;
                } catch (e) {
                    console.warn('Échec chargement', url, e.message);
                }
            }

            if (!response) {
                console.error('Impossible de charger les produits favoris, fallback local');
                allProducts = [];
                favoritesEmpty.style.display = 'block';
                return;
            }

            try {
                allProducts = await response.json();
            } catch (e) {
                console.error('JSON invalide pour les produits favoris', e);
                allProducts = [];
            }
            renderFavorites();
        }

        function renderFavorites() {
            if (favorites.length === 0) {
                favoritesEmpty.style.display = 'block';
                favoritesGrid.style.display = 'none';
                return;
            }

            favoritesEmpty.style.display = 'none';
            favoritesGrid.style.display = 'grid';

            const favoriteProducts = allProducts.filter(p => favorites.includes(parseInt(p.id, 10)));
            
            if (favoriteProducts.length === 0) {
                favoritesEmpty.style.display = 'block';
                favoritesGrid.style.display = 'none';
                return;
            }
            
            favoritesGrid.innerHTML = favoriteProducts.map(product => {
                const formatPrice = (v) => {
                    const n = typeof v === 'number' ? v : parseFloat(v);
                    return isFinite(n) ? n.toFixed(2) : '0.00';
                };
                const collectionLabels = {
                    'eco': '🌱 Éco',
                    'recycle': '♻️ Recyclé',
                    'classiques': '✨ Classique'
                };
                return `
                <article class="product" data-id="${product.id}" data-collection="${collectionLabels[product.collection] || product.collection}">
                    <div class="product-image-container">
                        <img src="${product.image}" alt="${product.name}" loading="lazy" width="280" height="280" onerror="window.lowaImgFallback(this)" />
                        <button class="fav-btn active" data-id="${product.id}" aria-label="Retirer des favoris" title="Retirer des favoris">❤️</button>
                    </div>
                    <h3>${product.name}</h3>
                    <p>${product.description}</p>
                    <div class="meta">
                        <span class="product-price">${formatPrice(product.price)} €</span>
                        <button class="btn primary add-to-cart" data-id="${product.id}" data-name="${product.name}" data-price="${product.price}">Ajouter</button>
                    </div>
                </article>`;
            }).join('');

            attachFavoriteListeners();
            attachCartListeners();
        }

        function toggleFavorite(productId) {
            const idNum = parseInt(productId, 10);
            const index = favorites.indexOf(idNum);
            if (index > -1) {
                favorites.splice(index, 1);
            } else {
                favorites.push(idNum);
            }
            favorites = Array.from(new Set(favorites));
            localStorage.setItem(FAVORITES_KEY, JSON.stringify(favorites));
        }

        function attachFavoriteListeners() {
            document.querySelectorAll('.fav-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const productId = e.target.dataset.id;
                    toggleFavorite(productId);
                    // Remove from view
                    renderFavorites();
                });
            });
        }

        // Clear all favorites
        document.getElementById('clear-favorites').addEventListener('click', () => {
            if (confirm('Voulez-vous vraiment supprimer tous vos favoris ?')) {
                favorites = [];
                localStorage.setItem('lowa_favorites', JSON.stringify(favorites));
                renderFavorites();
            }
        });

        // Cart Management
        let cart = JSON.parse(localStorage.getItem('cart')) || [];
        const cartButton = document.getElementById('cart-button');
        const cartCount = document.getElementById('cart-count');
        const cartModal = document.getElementById('cart-modal');
        const closeCartBtn = document.getElementById('close-cart');
        const cartItemsDiv = document.getElementById('cart-items');
        const cartTotalSpan = document.getElementById('cart-total');
        const clearCartBtn = document.getElementById('clear-cart');
        const checkoutBtn = document.getElementById('checkout');

        function updateCartUI() {
            cartCount.textContent = cart.length;
            cartItemsDiv.innerHTML = cart.map((item, idx) => `
                <div class="cart-item">
                    <img src="${item.image}" alt="${item.name}" width="60" height="60" />
                    <div class="info">
                        <h4>${item.name}</h4>
                        <p>${item.price.toFixed(2)} €</p>
                    </div>
                    <button class="btn" onclick="window.removeFromCart(${idx})" style="padding: 0.4rem 0.6rem; font-size: 0.85rem;">×</button>
                </div>
            `).join('');
            const total = cart.reduce((sum, item) => sum + item.price, 0);
            cartTotalSpan.textContent = total.toFixed(2);
            localStorage.setItem('cart', JSON.stringify(cart));
        }

        function attachCartListeners() {
            document.querySelectorAll('.add-to-cart').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const productId = e.target.dataset.id;
                    const product = document.querySelector(`[data-id="${productId}"]`);
                    if (!product) return;
                    const img = product.querySelector('img');
                    cart.push({
                        id: productId,
                        name: e.target.dataset.name,
                        price: parseFloat(e.target.dataset.price),
                        image: img.src
                    });
                    updateCartUI();
                    e.target.textContent = '✓ Ajouté';
                    setTimeout(() => { e.target.textContent = 'Ajouter'; }, 1500);
                });
            });
        }

        window.removeFromCart = function(idx) {
            cart.splice(idx, 1);
            updateCartUI();
        };

        cartButton.addEventListener('click', () => {
            cartModal.setAttribute('aria-hidden', 'false');
        });
        closeCartBtn.addEventListener('click', () => {
            cartModal.setAttribute('aria-hidden', 'true');
        });
        cartModal.addEventListener('click', (e) => {
            if (e.target === cartModal) {
                cartModal.setAttribute('aria-hidden', 'true');
            }
        });
        clearCartBtn.addEventListener('click', () => {
            cart = [];
            updateCartUI();
        });
        checkoutBtn.addEventListener('click', () => {
            if (cart.length === 0) {
                alert('Votre panier est vide');
                return;
            }
            alert(`Commande de ${cart.length} article(s) pour ${cartTotalSpan.textContent} €\nRedirection vers le paiement...`);
            cart = [];
            updateCartUI();
            cartModal.setAttribute('aria-hidden', 'true');
        });

        // Burger menu
        const burgerBtn = document.getElementById('burger-btn');
        const headerEl = document.querySelector('.site-header');
        burgerBtn?.addEventListener('click', () => {
            const open = headerEl.classList.toggle('menu-open');
            burgerBtn.setAttribute('aria-expanded', open);
        });

        // Initialize
        updateCartUI();
        loadFavorites();
    </script>
</body>
</html>
