<!DOCTYPE html>
<html lang="fr" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profil — LOWA</title>
    <!-- Google Fonts - Typography LOWA -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=Lora:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="preload" as="style" href="/public/css/homepage.css" />
    <link rel="stylesheet" href="/public/css/homepage.css" />
    <style>
      /* Profile specific styles - themes are in homepage.css */

      /* Apply theme colors to elements */

      /* Apply theme colors to elements */
      html[data-theme] body {
        background: var(--bg);
        color: var(--dark);
      }

      html[data-theme] a {
        color: var(--accent);
      }

      html[data-theme] a:hover {
        color: var(--muted);
      }

      html[data-theme] .site-header {
        background: var(--pale-green);
        border-bottom-color: var(--pastel-green);
      }

      html[data-theme] .main-nav a,
      html[data-theme] .main-nav button {
        color: var(--dark);
      }

      html[data-theme] .main-nav a:hover,
      html[data-theme] .main-nav button:hover {
        color: var(--accent);
        background: var(--pale-green);
      }

      html[data-theme] .btn {
        background: var(--accent);
        color: #fff;
        border-color: var(--accent);
      }

      html[data-theme] .btn:hover {
        opacity: 0.9;
      }

      html[data-theme] input[type="text"],
      html[data-theme] input[type="email"],
      html[data-theme] input[type="password"],
      html[data-theme] select {
        background: var(--pale-green);
        color: var(--dark);
        border-color: var(--pastel-green);
      }

      html[data-theme] input[type="checkbox"],
      html[data-theme] input[type="radio"] {
        accent-color: var(--accent);
      }

      html[data-theme] .card {
        background: var(--pale-green);
        border-color: var(--pastel-green);
        color: var(--dark);
      }

      html[data-theme] .profile-hero {
        background: var(--pale-green);
        border-color: var(--pastel-green);
      }

      html[data-theme] .avatar {
        background: var(--accent);
        color: #fff;
      }

      html[data-theme] .pill {
        color: var(--accent);
        background: var(--soft-green);
        border-color: var(--pastel-green);
      }

      html[data-theme] .history-item {
        border-bottom-color: var(--pastel-green);
      }

      html[data-theme] .theme-selector {
        display: flex;
        gap: 0.5rem;
        margin-top: 0.5rem;
        flex-wrap: wrap;
      }

      html[data-theme] .theme-option {
        padding: 0.5rem 1rem;
        border: 2px solid var(--pastel-green);
        border-radius: 8px;
        background: var(--pale-green);
        color: var(--dark);
        cursor: pointer;
        font-weight: 500;
        transition: all 0.2s ease;
      }

      html[data-theme] .theme-option:hover {
        border-color: var(--accent);
      }

      html[data-theme] .theme-option.active {
        background: var(--accent);
        color: #fff;
        border-color: var(--accent);
      }

      html[data-theme] .form-group {
        margin-bottom: 1rem;
      }

      html[data-theme] .form-group label {
        display: block;
        margin-bottom: 0.5rem;
        font-weight: 500;
        color: var(--dark);
      }

      html[data-theme] .form-group select,
      html[data-theme] .form-group input {
        width: 100%;
        padding: 0.5rem 0.75rem;
        border: 1px solid var(--pastel-green);
        border-radius: 6px;
        font-size: 0.95rem;
      }

      .profile-wrapper {
        max-width: 1000px;
        margin: 0 auto;
        padding: 2rem 1rem;
      }
      .profile-hero {
        box-shadow: var(--shadow-large);
        border-radius: 16px;
        padding: 1.5rem 2rem;
        display: flex;
        align-items: center;
        gap: 1rem;
        background: var(--pale-green);
        border: 1px solid var(--pastel-green);
      }
      .avatar {
        width: 64px; height: 64px;
        border-radius: 50%;
        display: grid; place-items: center;
        font-weight: 700; font-size: 1.2rem;
        box-shadow: var(--shadow-medium);
        overflow: hidden;
        background-size: cover;
        background-position: center;
      }
      .avatar img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .card { 
        border:1px solid var(--pastel-green); 
        border-radius:12px; 
        padding:1rem 1.25rem; 
        box-shadow: var(--shadow-medium);
        background: var(--pale-green);
        color: var(--dark);
      }
      .card h3 { margin-top:0; color: var(--dark); }
      .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
      .info-row { 
        display:flex; 
        gap: .5rem; 
        margin:.4rem 0;
        color: var(--dark);
      }
      .info-row strong { 
        min-width: 120px;
        color: var(--muted);
      }
      .history-item { 
        padding:.6rem .4rem; 
        display:flex; 
        justify-content:space-between;
        border-bottom: 1px solid var(--pastel-green);
      }
      .pill { 
        display:inline-block; 
        padding:.2rem .6rem; 
        border:1px solid var(--pastel-green); 
        border-radius:999px; 
        font-size:.85rem;
        color: var(--accent);
        background: var(--soft-green);
      }
      .actions { display:flex; gap:.6rem; align-items:center; }
      .section { margin-top:1.5rem; }
      .badge-admin{display:none;margin-left:0.5rem;padding:0.2rem 0.6rem;border-radius:12px;background:#1f2937;color:#fff;font-size:0.85rem;}
      .admin-actions{display:flex;flex-wrap:wrap;gap:0.6rem;margin-top:0.5rem;}
      .admin-actions .btn{flex:1;min-width:180px;text-align:center;}
    </style>
    <script src="/public/js/common.js"></script>
    <script src="/public/js/api-config.js"></script>
  </head>
  <body>
    <header class="site-header">
      <div class="container header-inner">
        <a class="brand" href="/">LOWA</a>
        <nav class="main-nav">
          <a href="/">Accueil</a>
        </nav>
        <div class="header-actions">
          <button id="logout-btn" class="btn">Déconnexion</button>
        </div>
      </div>
    </header>

    <main class="profile-wrapper">
      <div class="profile-hero">
        <div class="avatar" id="avatar" style="position:relative;cursor:pointer" title="Cliquer pour changer l'avatar">
          <span id="avatar-text">LG</span>
          <input type="file" id="avatar-upload" accept="image/*" style="display:none" />
        </div>
        <div>
          <h1 style="margin:0">Mon profil <span id="badge-role" class="badge-admin"></span></h1>
          <div class="pill" id="member-since">Membre depuis —</div>
        </div>
        <div class="actions" style="margin-left:auto">
          <a href="/public/pages/favoris.html" class="btn" style="text-decoration:none">Mes favoris</a>
        </div>
      </div>

      <div class="grid-2 section">
        <section class="card">
          <h3>Informations utilisateur</h3>
          <div id="user-info"></div>
        </section>
        <section class="card">
          <h3>Personnalisation de l'interface</h3>
          
          <!-- Theme Selection -->
          <div class="form-group">
            <label style="font-weight:bold;display:block;margin-bottom:0.5rem">Thème visuel</label>
            <div class="theme-selector">
              <button class="theme-option active" data-theme="light">Clair</button>
              <button class="theme-option" data-theme="dark">Crépuscule</button>
              <button class="theme-option" data-theme="temperate">Tempéré</button>
              <button class="theme-option" data-theme="auto">Auto</button>
            </div>
          </div>

          <!-- Font Size -->
          <div class="form-group" style="margin-top:1rem">
            <label for="pref-font-size" style="font-weight:bold">Taille de police</label>
            <select id="pref-font-size" style="width:100%;padding:0.5rem;margin-top:0.3rem">
              <option value="small">Petit (90%)</option>
              <option value="normal" selected>Normal (100%)</option>
              <option value="large">Grand (110%)</option>
              <option value="xlarge">Très grand (120%)</option>
            </select>
          </div>

          <!-- Spacing Density -->
          <div class="form-group" style="margin-top:1rem">
            <label for="pref-spacing" style="font-weight:bold">Densité d'espace</label>
            <select id="pref-spacing" style="width:100%;padding:0.5rem;margin-top:0.3rem">
              <option value="compact">Compact</option>
              <option value="normal" selected>Normal</option>
              <option value="comfortable">Confortable</option>
            </select>
          </div>

          <!-- Animations -->
          <label style="display:flex;gap:0.5rem;align-items:center;margin-top:1rem">
            <input type="checkbox" id="pref-animations" checked />
            <strong>Animations</strong>
          </label>

          <p id="prefs-adv-status" style="margin-top:0.5rem;color:var(--theme-text-muted);font-size:0.9rem"></p>
        </section>
      </div>

      <section class="card section">
        <h3>Préférences</h3>
        <label style="display:flex;gap:0.5rem;align-items:center">
          <input type="checkbox" id="cookie-consent" />
          Consentement aux cookies
        </label>
        <div class="form-group" style="margin-top:1rem">
          <label for="pref-lang" style="font-weight:bold;display:block;margin-bottom:0.5rem">Langue</label>
          <select id="pref-lang" style="width:100%;padding:0.5rem">
            <option value="fr" selected>🇫🇷 Français</option>
            <option value="en">🇬🇧 English</option>
          </select>
        </div>
        <label style="display:flex;gap:0.5rem;align-items:center;margin-top:0.75rem">
          <input type="checkbox" id="pref-notif" />
          Notifications email promotions
        </label>
        <button id="save-prefs" class="btn primary" style="margin-top:1rem">Enregistrer</button>
        <p id="prefs-status" style="margin-top:0.5rem;color:var(--theme-text-muted)"></p>
      </section>

      <section class="card section">
        <h3>Historique d'achats</h3>
        <div id="history"></div>
      </section>

      <section class="card section" id="admin-panel" style="display:none">
        <h3>Administration</h3>
        <p style="margin:0 0 0.5rem">Actions rapides pour les administrateurs/modérateurs.</p>
        <div class="admin-actions">
          <button class="btn" id="admin-products">Gérer les produits</button>
          <button class="btn" id="admin-stock">Gérer les stocks</button>
          <button class="btn" id="admin-roles">Gérer les rôles</button>
        </div>
      </section>
    </main>

    <script>
      const API = window.API_BASE || '/api';
      let sessionToken = null;

      function profileScopedGet(baseKey) {
        if (typeof scopedStorageGet === 'function') {
          return scopedStorageGet(baseKey);
        }
        return localStorage.getItem(baseKey);
      }

      function profileScopedSet(baseKey, value) {
        if (typeof scopedStorageSet === 'function') {
          scopedStorageSet(baseKey, value);
          return;
        }
        localStorage.setItem(baseKey, value);
      }

      // Avatar Management
      function loadAvatar() {
        const savedAvatar = profileScopedGet('lowa_avatar');
        if (savedAvatar) {
          const avatarEl = document.getElementById('avatar');
          avatarEl.style.backgroundImage = `url(${savedAvatar})`;
          avatarEl.style.backgroundSize = 'cover';
          avatarEl.style.backgroundPosition = 'center';
          document.getElementById('avatar-text').style.display = 'none';
        }
      }

      async function hydrateProfileStateFromCloud() {
        try {
          const state = await lowaReadUserState();
          if (!state) return;

          if (state.avatar) {
            profileScopedSet('lowa_avatar', state.avatar);
            loadAvatar();
          }

          if (state.theme) {
            profileScopedSet('lowa_theme', state.theme);
            applyTheme(state.theme);
          }

          if (state.font_size) profileScopedSet('lowa_pref_font_size', state.font_size);
          if (state.spacing) profileScopedSet('lowa_pref_spacing', state.spacing);
          if (typeof state.animations === 'boolean') profileScopedSet('lowa_pref_animations', String(state.animations));
          if (state.language) profileScopedSet('lowa_pref_lang', state.language);
          if (typeof state.notif === 'boolean') profileScopedSet('lowa_pref_notif', String(state.notif));

          loadAdvancedPrefs();
        } catch (e) {
          console.warn('Hydrate profile state warning:', e && e.message ? e.message : e);
        }
      }

      document.getElementById('avatar').addEventListener('click', () => {
        document.getElementById('avatar-upload').click();
      });

      document.getElementById('avatar-upload').addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file && file.type.startsWith('image/')) {
          const reader = new FileReader();
          reader.onload = (event) => {
            const avatarData = event.target.result;
            profileScopedSet('lowa_avatar', avatarData);
            loadAvatar();
          };
          reader.readAsDataURL(file);
        }
      });

      // Theme Management with Auto mode
      function initTheme() {
        const savedTheme = profileScopedGet('lowa_theme') || 'light';
        applyTheme(savedTheme);
      }

      function applyTheme(theme) {
        if (theme === 'auto') {
          const hour = new Date().getHours();
          const actualTheme = (hour >= 20 || hour < 7) ? 'dark' : 'light';
          document.documentElement.setAttribute('data-theme', actualTheme);
        } else {
          document.documentElement.setAttribute('data-theme', theme);
        }
        profileScopedSet('lowa_theme', theme);
        
        // Update active button
        document.querySelectorAll('.theme-option').forEach(btn => {
          btn.classList.toggle('active', btn.dataset.theme === theme);
        });
      }

      function setTheme(theme) {
        applyTheme(theme);
      }

      // Keyboard shortcut: press "u" to cycle theme (works anywhere, loops back to clair)
      document.addEventListener('keydown', (e) => {
        if (!e.key || e.key.toLowerCase() !== 'u') return;
        const tag = (e.target && e.target.tagName) ? e.target.tagName.toLowerCase() : '';
        // Allow use even inside the menu; only skip when typing in inputs/textareas/selects
        if (['input','textarea','select'].includes(tag)) return;
        const order = ['light', 'dark', 'temperate', 'auto'];
        const savedTheme = profileScopedGet('lowa_theme');
        const currentPref = order.includes(savedTheme) ? savedTheme : 'light';
        const idx = order.indexOf(currentPref);
        const next = order[(idx + 1) % order.length];
        setTheme(next);
        saveAdvancedPrefs();
        e.preventDefault();
      });

      document.addEventListener('DOMContentLoaded', () => {
        document.querySelectorAll('.theme-option').forEach(btn => {
          btn.addEventListener('click', () => {
            setTheme(btn.dataset.theme);
            saveAdvancedPrefs();
          });
        });
        
        // Add listeners for font size and spacing
        document.getElementById('pref-font-size').addEventListener('change', saveAdvancedPrefs);
        document.getElementById('pref-spacing').addEventListener('change', saveAdvancedPrefs);
        document.getElementById('pref-animations').addEventListener('change', saveAdvancedPrefs);
        
        loadAvatar();
        initTheme();
      });

      function loadSession() {
        try {
          const stored = localStorage.getItem('lowa_session');
          if (!stored) return;
          const s = JSON.parse(stored);
          sessionToken = s.token;
          console.log('Session chargée:', { token: !!sessionToken, user: !!s.user });
        } catch (e) {
          console.warn('Erreur lors du chargement de la session:', e);
        }
      }

      function formatSexe(val) {
        if (val === 'H') return 'Homme';
        if (val === 'F') return 'Femme';
        return val || '-';
      }

      async function fetchUser() {
        // Prioritize localStorage; try API as secondary
        let user = null;
        let usedFallback = false;
        
        // First, try to get user from stored session
        try {
          const stored = JSON.parse(localStorage.getItem('lowa_session') || '{}');
          if (stored.user) {
            user = stored.user;
            usedFallback = true;
            console.log('Utilisateur chargé depuis localStorage');
          }
        } catch (e) {
          console.warn('Erreur lors du parsing de lowa_session:', e);
        }
        
        // If we have sessionToken, try API to get fresh data
        if (sessionToken && !usedFallback) {
          try {
            console.log('Tentative API avec token...');
            const resp = await fetch(API + '/user', { headers: { Authorization: sessionToken } });
            if (!resp.ok) {
              const text = await resp.text();
              console.warn(`API erreur ${resp.status}: ${text}`);
              throw new Error(`API ${resp.status} ${resp.statusText}`);
            }
            user = await resp.json();
            usedFallback = false;
            console.log('Utilisateur chargé depuis API');
          } catch (apiErr) {
            console.warn('Erreur API, utilisation du fallback localStorage:', apiErr);
            if (!user) throw apiErr;
          }
        }
        
        if (!user) {
          throw new Error('Aucune donnée utilisateur disponible');
        }
        
        // Update avatar: show image if PDP exists, otherwise show initials
        const avatarContainer = document.getElementById('avatar');
        const avatarText = document.getElementById('avatar-text');
        
        if (user.pdp) {
          // User has a profile picture
          avatarContainer.style.backgroundImage = `url(${user.pdp})`;
          avatarText.style.display = 'none';
        } else {
          // Show initials
          const initials = (user.prenom?.[0] || 'L') + (user.nom?.[0] || 'G');
          avatarText.textContent = initials.toUpperCase();
          avatarText.style.display = 'block';
          avatarContainer.style.backgroundImage = 'none';
        }
        
        if (user.date_creation) {
          document.getElementById('member-since').textContent = 'Membre depuis — ' + new Date(user.date_creation).toLocaleDateString();
        }
        const badge = document.getElementById('badge-role');
        if (user.role && (user.role.toLowerCase() === 'admin' || user.role.toLowerCase() === 'moderator')) {
          badge.style.display = 'inline-block';
          badge.textContent = user.role.toLowerCase() === 'admin' ? 'Admin' : 'Modérateur';
          document.getElementById('admin-panel').style.display = 'block';
        }

        const userHTML = `
          <div class="info-row"><strong>Nom:</strong> <span>${user.prenom || 'N/A'} ${user.nom || 'N/A'}</span></div>
          <div class="info-row"><strong>Email:</strong> <span>${user.email || 'N/A'}</span></div>
          <div class="info-row"><strong>Sexe:</strong> <span>${formatSexe(user.sexe)}</span></div>
          <div class="info-row"><strong>Rôle:</strong> <span>${user.role || 'user'}</span></div>
          <div class="info-row"><strong>Créé le:</strong> <span>${user.date_creation ? new Date(user.date_creation).toLocaleString() : 'N/A'}</span></div>
          ${usedFallback ? '<div class="info-row" style="color: var(--muted); font-size: 0.9rem; margin-top: 0.5rem;">(Données depuis votre session locale)</div>' : ''}
        `;
        document.getElementById('user-info').innerHTML = userHTML;
        return user;
      }

      async function fetchHistory() {
        if (!sessionToken) { document.getElementById('history').innerHTML = '<p>Pas d\'historique.</p>'; return; }
        const resp = await fetch(API + '/purchase-history', { headers: { Authorization: sessionToken } });
        if (!resp.ok) { document.getElementById('history').innerHTML = '<p>Pas d\'historique.</p>'; return; }
        const items = await resp.json();
        if (!items.length) { document.getElementById('history').innerHTML = '<p>Pas d\'historique.</p>'; return; }
        document.getElementById('history').innerHTML = items.map(i => `
          <div class="history-item" style="padding:0.5rem 0;border-bottom:1px solid var(--theme-border)">
            <div><strong>Achat du:</strong> ${new Date(i.date).toLocaleString()}</div>
            <div><strong>Total:</strong> ${i.total.toFixed(2)} €</div>
          </div>
        `).join('');
      }

      async function loadPrefs() {
        // Optionally could add GET /user-preferences; for now reflect local storage
        const consent = profileScopedGet('lowa_cookie_consent');
        if (consent) {
          try { const obj = JSON.parse(consent); document.getElementById('cookie-consent').checked = obj.status === 'accepted'; } catch {}
        }
      }

      function loadAdvancedPrefs(){
        const lang = profileScopedGet('lowa_pref_lang') || 'fr';
        const notif = profileScopedGet('lowa_pref_notif') === 'true';
        const animations = profileScopedGet('lowa_pref_animations') !== 'false';
        const theme = profileScopedGet('lowa_theme') || 'light';
        const fontSize = profileScopedGet('lowa_pref_font_size') || 'normal';
        const spacing = profileScopedGet('lowa_pref_spacing') || 'normal';
        
        document.getElementById('pref-lang').value = lang;
        document.getElementById('pref-notif').checked = notif;
        document.getElementById('pref-animations').checked = animations;
        document.getElementById('pref-font-size').value = fontSize;
        document.getElementById('pref-spacing').value = spacing;
        
        // Set active theme button
        document.querySelectorAll('.theme-option').forEach(btn => {
          if (btn.dataset.theme === theme) {
            btn.classList.add('active');
          }
        });

        // Apply font size
        applyFontSize(fontSize);
        applySpacing(spacing);
      }

      function applyFontSize(size) {
        const sizes = { small: '90%', normal: '100%', large: '110%', xlarge: '120%' };
        document.documentElement.style.setProperty('--font-scale', sizes[size] || '100%');
        if (document.body.style.fontSize === '') {
          document.body.style.fontSize = sizes[size] || '100%';
        }
      }

      function applySpacing(spacing) {
        const spacings = {
          compact: '0.75',
          normal: '1',
          comfortable: '1.25'
        };
        const scale = spacings[spacing] || '1';
        document.documentElement.style.setProperty('--spacing-scale', scale);
      }

      function saveAdvancedPrefs(){
        const lang = document.getElementById('pref-lang').value;
        const notif = document.getElementById('pref-notif').checked;
        const animations = document.getElementById('pref-animations').checked;
        const theme = document.documentElement.getAttribute('data-theme');
        const fontSize = document.getElementById('pref-font-size').value;
        const spacing = document.getElementById('pref-spacing').value;
        
        profileScopedSet('lowa_pref_lang', String(lang));
        profileScopedSet('lowa_pref_notif', String(notif));
        profileScopedSet('lowa_pref_animations', String(animations));
        profileScopedSet('lowa_theme', String(theme));
        profileScopedSet('lowa_pref_font_size', String(fontSize));
        profileScopedSet('lowa_pref_spacing', String(spacing));

        lowaWriteUserStatePatch({
          theme: String(theme),
          font_size: String(fontSize),
          spacing: String(spacing),
          animations: Boolean(animations),
          language: String(lang),
          notif: Boolean(notif)
        }).catch(() => {});
        
        // Apply animations preference
        if (!animations) {
          document.documentElement.style.setProperty('--transition-fast', '0s');
          document.documentElement.style.setProperty('--transition-medium', '0s');
        } else {
          document.documentElement.style.removeProperty('--transition-fast');
          document.documentElement.style.removeProperty('--transition-medium');
        }

        // Apply font size and spacing
        applyFontSize(fontSize);
        applySpacing(spacing);
        
        document.getElementById('prefs-adv-status').textContent = '✅ Préférences enregistrées';
        setTimeout(() => {
          document.getElementById('prefs-adv-status').textContent = '';
        }, 3000);
      }

      async function savePrefs() {
        const status = document.getElementById('cookie-consent').checked ? 'accepted' : 'declined';
        const resp = await fetch(API + '/user-preferences', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', Authorization: sessionToken },
          body: JSON.stringify({ cookie_consent: status })
        });
        if (!resp.ok) throw new Error('Save failed');
        document.getElementById('prefs-status').textContent = 'Préférences enregistrées';
        setTimeout(() => {
          document.getElementById('prefs-status').textContent = '';
        }, 3000);
      }

      document.getElementById('save-prefs').addEventListener('click', async () => {
        try { await savePrefs(); } catch (e) { alert('Erreur: ' + e.message); }
      });

      document.getElementById('pref-lang').addEventListener('change', saveAdvancedPrefs);
      document.getElementById('pref-notif').addEventListener('change', saveAdvancedPrefs);
      document.getElementById('pref-animations').addEventListener('change', saveAdvancedPrefs);
      document.getElementById('pref-font-size').addEventListener('change', saveAdvancedPrefs);
      document.getElementById('pref-spacing').addEventListener('change', saveAdvancedPrefs);

      document.getElementById('logout-btn').addEventListener('click', async () => {
        try { await fetch(API + '/logout', { method: 'POST', headers: { Authorization: sessionToken } }); } catch {}
        localStorage.removeItem('lowa_session');
        if (typeof clearActiveStorageUserId === 'function') clearActiveStorageUserId();
        window.location.href = '/';
      });

      // Avatar upload handler
      document.getElementById('avatar').addEventListener('click', () => {
        document.getElementById('avatar-upload').click();
      });

      document.getElementById('avatar-upload').addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        // Validate file type
        if (!file.type.startsWith('image/')) {
          alert('Veuillez sélectionner une image valide');
          return;
        }

        // Validate file size (max 2MB)
        if (file.size > 2 * 1024 * 1024) {
          alert('L\'image est trop grande (max 2MB)');
          return;
        }

        // Convert to base64
        const reader = new FileReader();
        reader.onload = async (event) => {
          const base64 = event.target.result;
          
          try {
            // Update profile picture via API
            const resp = await fetch(API + '/user', {
              method: 'PUT',
              headers: {
                'Content-Type': 'application/json',
                Authorization: sessionToken
              },
              body: JSON.stringify({ pdp: base64 })
            });

            if (!resp.ok) {
              throw new Error('Échec de la mise à jour distante');
            }

            const updatedUser = await resp.json();
            
            // Update UI
            const avatarContainer = document.getElementById('avatar');
            const avatarText = document.getElementById('avatar-text');
            avatarContainer.style.backgroundImage = `url(${base64})`;
            avatarText.style.display = 'none';

            // Update session storage
            const session = JSON.parse(localStorage.getItem('lowa_session') || '{}');
            session.user = Object.assign({}, session.user || {}, updatedUser || {});
            if (!session.storage_scope && session.user && (session.user.id || session.user.email)) {
              session.storage_scope = String(session.user.id || session.user.email);
            }
            localStorage.setItem('lowa_session', JSON.stringify(session));
            profileScopedSet('lowa_avatar', base64);
            lowaWriteUserStatePatch({ avatar: base64 }).catch(() => {});

            console.log('Photo de profil mise à jour avec succès');
          } catch (err) {
            console.warn('Mise à jour distante indisponible, fallback local:', err && err.message ? err.message : err);

            // Fallback local: ne pas bloquer l'utilisateur si l'API profil est indisponible
            const avatarContainer = document.getElementById('avatar');
            const avatarText = document.getElementById('avatar-text');
            avatarContainer.style.backgroundImage = `url(${base64})`;
            avatarText.style.display = 'none';
            profileScopedSet('lowa_avatar', base64);
            lowaWriteUserStatePatch({ avatar: base64 }).catch(() => {});

            const session = JSON.parse(localStorage.getItem('lowa_session') || '{}');
            session.user = Object.assign({}, session.user || {}, { pdp: base64 });
            if (!session.storage_scope && session.user && (session.user.id || session.user.email)) {
              session.storage_scope = String(session.user.id || session.user.email);
            }
            localStorage.setItem('lowa_session', JSON.stringify(session));

            alert('Photo enregistrée localement sur cet appareil.');
          }
        };
        reader.readAsDataURL(file);
      });

      document.getElementById('logout-btn-hero').addEventListener('click', async () => {
        try { await fetch(API + '/logout', { method: 'POST', headers: { Authorization: sessionToken } }); } catch {}
        localStorage.removeItem('lowa_session');
        if (typeof clearActiveStorageUserId === 'function') clearActiveStorageUserId();
        window.location.href = '/';
      });

      (async function init() {
        initTheme();
        loadSession();
        try {
          console.log('Initialisation du profil...');
          await hydrateProfileStateFromCloud();
          await fetchUser();
          await fetchHistory();
          await loadPrefs();
          loadAdvancedPrefs();
          console.log('Profil chargé avec succès');
        } catch (e) {
          console.error('Profil - récupération utilisateur échouée:', e);
          let msg = 'Aucune session trouvée. Connectez-vous depuis la page d\'accueil.';
          if (e && e.message && e.message.includes('API')) {
            msg = 'Impossible de récupérer vos informations du serveur. Vérifiez votre connexion.';
          }
          document.getElementById('user-info').innerHTML = `<div class="info-row"><strong>⚠️ Connexion requise</strong> <span>${msg}</span></div>`;
        }
      })();
    </script>
  </body>
</html>
