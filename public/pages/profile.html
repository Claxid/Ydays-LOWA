<!DOCTYPE html>
<html lang="fr" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/public/images/favicon.svg" />
    <link rel="apple-touch-icon" href="/public/images/logo.png" />
    <title>Profil — LOWA</title>
    <!-- Google Fonts - Typography LOWA -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&family=Lora:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="preload" as="style" href="/public/css/homepage.css" />
    <link rel="stylesheet" href="/public/css/homepage.css" />
    <style>
      /* Profile specific styles - themes are in homepage.css */

      /* Apply theme colors to elements */

      /* Apply theme colors to elements */
      html[data-theme] body {
        background: var(--bg);
        color: var(--dark);
      }

      html[data-theme] a {
        color: var(--accent);
      }

      html[data-theme] a:hover {
        color: var(--muted);
      }

      html[data-theme] .site-header {
        background: var(--pale-green);
        border-bottom-color: var(--pastel-green);
      }

      html[data-theme] .main-nav a,
      html[data-theme] .main-nav button {
        color: var(--dark);
      }

      html[data-theme] .main-nav a:hover,
      html[data-theme] .main-nav button:hover {
        color: var(--accent);
        background: var(--pale-green);
      }

      html[data-theme] .btn {
        background: var(--accent);
        color: #fff;
        border-color: var(--accent);
      }

      html[data-theme] .btn:hover {
        opacity: 0.9;
      }

      html[data-theme] input[type="text"],
      html[data-theme] input[type="email"],
      html[data-theme] input[type="password"],
      html[data-theme] select {
        background: var(--pale-green);
        color: var(--dark);
        border-color: var(--pastel-green);
      }

      html[data-theme] input[type="checkbox"],
      html[data-theme] input[type="radio"] {
        accent-color: var(--accent);
      }

      html[data-theme] .card {
        background: var(--pale-green);
        border-color: var(--pastel-green);
        color: var(--dark);
      }

      html[data-theme] .profile-hero {
        background: var(--pale-green);
        border-color: var(--pastel-green);
      }

      html[data-theme] .avatar {
        background: var(--accent);
        color: #fff;
      }

      html[data-theme] .pill {
        color: var(--accent);
        background: var(--soft-green);
        border-color: var(--pastel-green);
      }

      html[data-theme] .history-item {
        border-bottom-color: var(--pastel-green);
      }

      html[data-theme] .form-group {
        margin-bottom: 1rem;
      }

      html[data-theme] .form-group label {
        display: block;
        margin-bottom: 0.5rem;
        font-weight: 500;
        color: var(--dark);
      }

      html[data-theme] .form-group select,
      html[data-theme] .form-group input {
        width: 100%;
        padding: 0.5rem 0.75rem;
        border: 1px solid var(--pastel-green);
        border-radius: 6px;
        font-size: 0.95rem;
      }

      .profile-wrapper {
        max-width: 1000px;
        margin: 0 auto;
        padding: 2rem 1rem;
      }
      .profile-hero {
        box-shadow: var(--shadow-large);
        border-radius: 16px;
        padding: 1.5rem 2rem;
        display: flex;
        align-items: center;
        gap: 1rem;
        background: var(--pale-green);
        border: 1px solid var(--pastel-green);
      }
      .avatar {
        width: 64px; height: 64px;
        border-radius: 50%;
        display: grid; place-items: center;
        font-weight: 700; font-size: 1.2rem;
        box-shadow: var(--shadow-medium);
        overflow: hidden;
        background-size: cover;
        background-position: center;
      }
      .avatar img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .card { 
        border:1px solid var(--pastel-green); 
        border-radius:12px; 
        padding:1rem 1.25rem; 
        box-shadow: var(--shadow-medium);
        background: var(--pale-green);
        color: var(--dark);
      }
      .card h3 { margin-top:0; color: var(--dark); }
      .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
      .info-row { 
        display:flex; 
        gap: .5rem; 
        margin:.4rem 0;
        color: var(--dark);
      }
      .info-row strong { 
        min-width: 120px;
        color: var(--muted);
      }
      .history-item { 
        padding:.6rem .4rem; 
        display:flex; 
        justify-content:space-between;
        border-bottom: 1px solid var(--pastel-green);
      }
      .pill { 
        display:inline-block; 
        padding:.2rem .6rem; 
        border:1px solid var(--pastel-green); 
        border-radius:999px; 
        font-size:.85rem;
        color: var(--accent);
        background: var(--soft-green);
      }
      .actions { display:flex; gap:.6rem; align-items:center; }
      .section { margin-top:1.5rem; }
      .badge-admin{display:none;margin-left:0.5rem;padding:0.2rem 0.6rem;border-radius:12px;background:#1f2937;color:#fff;font-size:0.85rem;}
      .admin-actions{display:flex;flex-wrap:wrap;gap:0.6rem;margin-top:0.5rem;}
      .admin-actions .btn{flex:1;min-width:180px;text-align:center;}
    </style>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="/public/js/common.js"></script>
    <script src="/public/js/api-config.js"></script>
  </head>
  <body>
    <header class="site-header">
      <div class="container header-inner">
        <a class="brand" href="/index.html" aria-label="LOWA - Accueil">
          <img class="brand-logo" src="/public/images/logo.png" alt="LOWA" />
        </a>
        <nav class="main-nav">
          <a href="/index.html">Accueil</a>
        </nav>
        <div class="header-actions">
          <button id="logout-btn" class="btn">Déconnexion</button>
        </div>
      </div>
    </header>

    <main class="profile-wrapper">
      <div class="profile-hero">
        <div class="avatar" id="avatar" style="position:relative;cursor:pointer" title="Cliquer pour changer l'avatar">
          <span id="avatar-text">LG</span>
          <input type="file" id="avatar-upload" accept="image/*" style="display:none" />
        </div>
        <div>
          <h1 style="margin:0">Mon profil <span id="badge-role" class="badge-admin"></span></h1>
          <div class="pill" id="member-since">Membre depuis —</div>
        </div>
        <div class="actions" style="margin-left:auto">
          <a href="/public/pages/favoris.html" class="btn" style="text-decoration:none">Mes favoris</a>
        </div>
      </div>

      <div class="grid-2 section">
        <section class="card">
          <h3>Informations utilisateur</h3>
          <div id="user-info"></div>
          <form id="profile-info-form" style="margin-top:1rem">
            <div class="form-group">
              <label for="profile-prenom">Prénom</label>
              <input type="text" id="profile-prenom" autocomplete="given-name" />
            </div>
            <div class="form-group">
              <label for="profile-nom">Nom</label>
              <input type="text" id="profile-nom" autocomplete="family-name" />
            </div>
            <div class="form-group">
              <label for="profile-sexe">Sexe</label>
              <select id="profile-sexe">
                <option value="">Non renseigné</option>
                <option value="H">Homme</option>
                <option value="F">Femme</option>
                <option value="Autre">Autre</option>
              </select>
            </div>
            <button type="submit" id="save-profile-info" class="btn primary">Enregistrer les informations</button>
            <p id="profile-info-status" style="margin-top:0.5rem;color:var(--theme-text-muted)"></p>
          </form>
        </section>
        <section class="card">
          <h3>Personnalisation de l'interface</h3>
          <div class="form-group">
            <label style="font-weight:bold;display:flex;gap:0.5rem;align-items:center">
              <input type="checkbox" id="pref-theme-auto" checked />
              Mode automatique
            </label>
            <p style="margin:0.4rem 0 0;color:var(--theme-text-muted);font-size:0.9rem">
              Nuit: sombre, matin et soir: tempéré, jour: clair.
            </p>
          </div>

          <!-- Font Size -->
          <div class="form-group" style="margin-top:1rem">
            <label for="pref-font-size" style="font-weight:bold">Taille de police</label>
            <select id="pref-font-size" style="width:100%;padding:0.5rem;margin-top:0.3rem">
              <option value="small">Petit (90%)</option>
              <option value="normal" selected>Normal (100%)</option>
              <option value="large">Grand (110%)</option>
              <option value="xlarge">Très grand (120%)</option>
            </select>
          </div>

          <!-- Spacing Density -->
          <div class="form-group" style="margin-top:1rem">
            <label for="pref-spacing" style="font-weight:bold">Densité d'espace</label>
            <select id="pref-spacing" style="width:100%;padding:0.5rem;margin-top:0.3rem">
              <option value="compact">Compact</option>
              <option value="normal" selected>Normal</option>
              <option value="comfortable">Confortable</option>
            </select>
          </div>

          <!-- Animations -->
          <label style="display:flex;gap:0.5rem;align-items:center;margin-top:1rem">
            <input type="checkbox" id="pref-animations" checked />
            <strong>Animations</strong>
          </label>

          <p id="prefs-adv-status" style="margin-top:0.5rem;color:var(--theme-text-muted);font-size:0.9rem"></p>
        </section>
      </div>

      <section class="card section">
        <h3>Préférences</h3>
        <label style="display:flex;gap:0.5rem;align-items:center">
          <input type="checkbox" id="cookie-consent" />
          Consentement aux cookies
        </label>
        <div class="form-group" style="margin-top:1rem">
          <label for="pref-lang" style="font-weight:bold;display:block;margin-bottom:0.5rem">Langue</label>
          <select id="pref-lang" style="width:100%;padding:0.5rem">
            <option value="fr" selected>🇫🇷 Français</option>
            <option value="en">🇬🇧 English</option>
          </select>
        </div>
        <label style="display:flex;gap:0.5rem;align-items:center;margin-top:0.75rem">
          <input type="checkbox" id="pref-notif" />
          Notifications email promotions
        </label>
        <button id="save-prefs" class="btn primary" style="margin-top:1rem">Enregistrer</button>
        <p id="prefs-status" style="margin-top:0.5rem;color:var(--theme-text-muted)"></p>
      </section>

      <section class="card section">
        <h3>Historique d'achats</h3>
        <div id="history"></div>
      </section>

      <section class="card section" id="admin-panel" style="display:none">
        <h3>Administration</h3>
        <p style="margin:0 0 0.5rem">Actions rapides pour les administrateurs/modérateurs.</p>
        <div class="admin-actions">
          <button class="btn" id="admin-products">Gérer les produits</button>
          <button class="btn" id="admin-stock">Gérer les stocks</button>
          <button class="btn" id="admin-roles">Gérer les rôles</button>
        </div>
      </section>
    </main>

    <script>
      const API = window.API_BASE || (window.LOWA && window.LOWA.API && window.LOWA.API.BASE) || '/api';
      const API_CANDIDATES = Array.from(new Set([
        API,
        window.API_BASE,
        window.LOWA && window.LOWA.API && window.LOWA.API.BASE,
        '/api'
      ].filter(Boolean).map((base) => String(base).replace(/\/$/, ''))));
      let sessionToken = null;
      let localSessionUser = null;
      let profileCloudState = {
        authUser: null,
        profile: null,
        userState: null
      };

      function addListenerById(id, eventName, handler) {
        const el = document.getElementById(id);
        if (el) el.addEventListener(eventName, handler);
      }

      function buildApiUrl(base, path) {
        const cleanBase = String(base || '').replace(/\/$/, '');
        const cleanPath = String(path || '').replace(/^\//, '');
        return `${cleanBase}/${cleanPath}`;
      }

      async function fetchWithApiFallback(path, options = {}) {
        for (const base of API_CANDIDATES) {
          try {
            const response = await fetch(buildApiUrl(base, path), options);
            if (response.ok) return response;
          } catch (e) {
            // Try next base
          }
        }
        throw new Error(`API indisponible pour ${path}`);
      }

      async function ensureSupabaseLoaded(timeoutMs = 5000) {
        if (window.supabase && typeof window.supabase.createClient === 'function') return true;

        const scriptId = 'lowa-supabase-cdn-loader';
        if (!document.getElementById(scriptId)) {
          const script = document.createElement('script');
          script.id = scriptId;
          script.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';
          script.async = true;
          document.head.appendChild(script);
        }

        const start = Date.now();
        while (Date.now() - start < timeoutMs) {
          if (window.supabase && typeof window.supabase.createClient === 'function') {
            return true;
          }
          await new Promise((resolve) => setTimeout(resolve, 120));
        }
        return false;
      }

      // Avatar Management
      function loadAvatar() {
        const savedAvatar = (profileCloudState.userState && profileCloudState.userState.avatar) || (profileCloudState.profile && profileCloudState.profile.pdp) || '';
        if (savedAvatar) {
          const avatarEl = document.getElementById('avatar');
          avatarEl.style.backgroundImage = `url(${savedAvatar})`;
          avatarEl.style.backgroundSize = 'cover';
          avatarEl.style.backgroundPosition = 'center';
          document.getElementById('avatar-text').style.display = 'none';
        }
      }

      async function getGlobalSiteTheme() {
        try {
          const response = await fetchWithApiFallback('admin/settings/default-theme', { cache: 'no-cache' });
          const data = await response.json();
          return data && data.theme ? String(data.theme) : 'light';
        } catch (e) {
          return 'light';
        }
      }

      function getAutoThemeByTime(date = new Date()) {
        const hour = date.getHours();
        if (hour >= 20 || hour < 6) return 'dark';
        if ((hour >= 6 && hour < 10) || (hour >= 17 && hour < 20)) return 'temperate';
        return 'light';
      }

      async function applyResolvedProfileTheme() {
        const globalTheme = await getGlobalSiteTheme();
        const autoEnabled = profileCloudState.userState && typeof profileCloudState.userState.theme_auto === 'boolean'
          ? profileCloudState.userState.theme_auto
          : true;
        const activeTheme = globalTheme === 'noel' ? globalTheme : (autoEnabled ? getAutoThemeByTime() : globalTheme);
        document.documentElement.setAttribute('data-theme', activeTheme);
      }

      function loadThemeAutoPref() {
        const autoEnabled = profileCloudState.userState && typeof profileCloudState.userState.theme_auto === 'boolean'
          ? profileCloudState.userState.theme_auto
          : true;
        const toggle = document.getElementById('pref-theme-auto');
        if (toggle) toggle.checked = autoEnabled;
      }

      async function hydrateProfileStateFromCloud() {
        try {
          const [authUser, profile, userState] = await Promise.all([
            lowaGetAuthUser(),
            lowaReadPublicProfile(),
            lowaReadUserState()
          ]);

          profileCloudState.authUser = authUser;
          profileCloudState.profile = profile || null;
          profileCloudState.userState = userState || null;

          if (userState && userState.theme) {
            applyTheme(userState.theme);
          }

          loadAvatar();
          loadThemeAutoPref();
          loadAdvancedPrefs();
        } catch (e) {
          console.warn('Hydrate profile state warning:', e && e.message ? e.message : e);
        }
      }

      // Theme Management with Auto mode
      function initTheme() {
        applyResolvedProfileTheme();
      }

      function applyTheme(theme) {
        document.documentElement.setAttribute('data-theme', theme);
      }

      async function setThemeAuto(enabled) {
        profileCloudState.userState = Object.assign({}, profileCloudState.userState || {}, { theme_auto: Boolean(enabled) });
        const toggle = document.getElementById('pref-theme-auto');
        if (toggle) toggle.checked = Boolean(enabled);
        const ok = await lowaWriteUserStatePatch(profileCloudState.userState);
        if (!ok) {
          throw new Error('Impossible de synchroniser le mode automatique');
        }
        await applyResolvedProfileTheme();
      }

      // Keyboard shortcut: press "u" to cycle theme (works anywhere, loops back to clair)
      document.addEventListener('keydown', (e) => {
        if (!e.key || e.key.toLowerCase() !== 'u') return;
        const tag = (e.target && e.target.tagName) ? e.target.tagName.toLowerCase() : '';
        // Allow use even inside the menu; only skip when typing in inputs/textareas/selects
        if (['input','textarea','select'].includes(tag)) return;
        const toggle = document.getElementById('pref-theme-auto');
        if (!toggle) return;
        toggle.checked = !toggle.checked;
        setThemeAuto(toggle.checked).catch(() => {});
        e.preventDefault();
      });

      document.addEventListener('DOMContentLoaded', () => {
        addListenerById('pref-theme-auto', 'change', (e) => {
          setThemeAuto(e.target.checked).catch((err) => {
            console.warn('Auto theme sync warning:', err && err.message ? err.message : err);
          });
        });

        addListenerById('pref-font-size', 'change', saveAdvancedPrefs);
        addListenerById('pref-spacing', 'change', saveAdvancedPrefs);
        addListenerById('pref-animations', 'change', saveAdvancedPrefs);
        
        loadAvatar();
        initTheme();
      });

      function loadSession() {
        try {
          const stored = localStorage.getItem('lowa_session');
          if (!stored) return;
          const s = JSON.parse(stored);
          sessionToken = s.token;
          localSessionUser = s.user || null;
          console.log('Session chargée:', { token: !!sessionToken, user: !!s.user });
        } catch (e) {
          console.warn('Erreur lors du chargement de la session:', e);
        }
      }

      function formatSexe(val) {
        if (val === 'H') return 'Homme';
        if (val === 'F') return 'Femme';
        return val || '-';
      }

      async function fetchUser() {
        try {
          const authUser = profileCloudState.authUser || await lowaGetAuthUser();
          if (!authUser && !localSessionUser) {
            throw new Error('Aucune donnée utilisateur disponible');
          }

          const profile = profileCloudState.profile || await lowaReadPublicProfile();
          const userState = profileCloudState.userState || await lowaReadUserState();

          profileCloudState.authUser = authUser;
          profileCloudState.profile = profile || null;
          profileCloudState.userState = userState || null;

          const user = {
            email: (authUser && authUser.email) || localSessionUser?.email || profile?.email || '',
            nom: profile?.nom || (authUser && authUser.user_metadata?.nom) || localSessionUser?.nom || (authUser && authUser.user_metadata?.full_name?.split(' ').slice(1).join(' ')) || '',
            prenom: profile?.prenom || (authUser && authUser.user_metadata?.prenom) || localSessionUser?.prenom || (authUser && authUser.user_metadata?.full_name?.split(' ')[0]) || '',
            sexe: profile?.sexe || (authUser && authUser.user_metadata?.sexe) || localSessionUser?.sexe || '',
            role: (authUser && (authUser.user_metadata?.role || authUser.app_metadata?.role)) || 'user',
            pdp: (userState && userState.avatar) || profile?.pdp || '',
            date_creation: (authUser && authUser.created_at) || ''
          };

          const avatarContainer = document.getElementById('avatar');
          const avatarText = document.getElementById('avatar-text');

          if (user.pdp) {
            avatarContainer.style.backgroundImage = `url(${user.pdp})`;
            avatarText.style.display = 'none';
          } else {
            const initials = (user.prenom?.[0] || 'L') + (user.nom?.[0] || 'G');
            avatarText.textContent = initials.toUpperCase();
            avatarText.style.display = 'block';
            avatarContainer.style.backgroundImage = 'none';
          }

          if (user.date_creation) {
            document.getElementById('member-since').textContent = 'Membre depuis — ' + new Date(user.date_creation).toLocaleDateString();
          }
          const badge = document.getElementById('badge-role');
          if (user.role && (String(user.role).toLowerCase() === 'admin' || String(user.role).toLowerCase() === 'moderator')) {
            badge.style.display = 'inline-block';
            badge.textContent = String(user.role).toLowerCase() === 'admin' ? 'Admin' : 'Modérateur';
            document.getElementById('admin-panel').style.display = 'block';
          }

          document.getElementById('profile-prenom').value = user.prenom || '';
          document.getElementById('profile-nom').value = user.nom || '';
          document.getElementById('profile-sexe').value = user.sexe || '';

          const userHTML = `
            <div class="info-row"><strong>Nom:</strong> <span>${user.prenom || 'N/A'} ${user.nom || 'N/A'}</span></div>
            <div class="info-row"><strong>Email:</strong> <span>${user.email || 'N/A'}</span></div>
            <div class="info-row"><strong>Sexe:</strong> <span>${formatSexe(user.sexe)}</span></div>
            <div class="info-row"><strong>Rôle:</strong> <span>${user.role || 'user'}</span></div>
            <div class="info-row"><strong>Créé le:</strong> <span>${user.date_creation ? new Date(user.date_creation).toLocaleString() : 'N/A'}</span></div>
          `;
          document.getElementById('user-info').innerHTML = userHTML;
          return user;
        } catch (e) {
          throw new Error('Aucune donnée utilisateur disponible');
        }
      }

      async function fetchHistory() {
        if (!sessionToken) { document.getElementById('history').innerHTML = '<p>Pas d\'historique.</p>'; return; }
        let resp;
        try {
          resp = await fetchWithApiFallback('purchase-history', { headers: { Authorization: sessionToken } });
        } catch (e) {
          document.getElementById('history').innerHTML = '<p>Pas d\'historique.</p>';
          return;
        }
        if (!resp.ok) { document.getElementById('history').innerHTML = '<p>Pas d\'historique.</p>'; return; }
        const items = await resp.json();
        if (!items.length) { document.getElementById('history').innerHTML = '<p>Pas d\'historique.</p>'; return; }
        document.getElementById('history').innerHTML = items.map(i => `
          <div class="history-item" style="padding:0.5rem 0;border-bottom:1px solid var(--theme-border)">
            <div><strong>Achat du:</strong> ${new Date(i.date).toLocaleString()}</div>
            <div><strong>Total:</strong> ${i.total.toFixed(2)} €</div>
          </div>
        `).join('');
      }

      async function loadPrefs() {
        const state = profileCloudState.userState || await lowaReadUserState();
        if (state && state.cookie_consent) {
          document.getElementById('cookie-consent').checked = state.cookie_consent === 'accepted';
        }
      }

      function loadAdvancedPrefs(){
        const state = profileCloudState.userState || {};
        const lang = state.language || 'fr';
        const notif = state.notif === true;
        const animations = state.animations !== false;
        const fontSize = state.font_size || 'normal';
        const spacing = state.spacing || 'normal';
        const autoEnabled = state.theme_auto !== false;
        
        document.getElementById('pref-lang').value = lang;
        document.getElementById('pref-notif').checked = notif;
        document.getElementById('pref-animations').checked = animations;
        document.getElementById('pref-font-size').value = fontSize;
        document.getElementById('pref-spacing').value = spacing;
        document.getElementById('pref-theme-auto').checked = autoEnabled;

        // Apply font size
        applyFontSize(fontSize);
        applySpacing(spacing);
      }

      function applyFontSize(size) {
        const sizes = { small: '90%', normal: '100%', large: '110%', xlarge: '120%' };
        document.documentElement.style.setProperty('--font-scale', sizes[size] || '100%');
        if (document.body.style.fontSize === '') {
          document.body.style.fontSize = sizes[size] || '100%';
        }
      }

      function applySpacing(spacing) {
        const spacings = {
          compact: '0.75',
          normal: '1',
          comfortable: '1.25'
        };
        const scale = spacings[spacing] || '1';
        document.documentElement.style.setProperty('--spacing-scale', scale);
      }

      function saveAdvancedPrefs(){
        const lang = document.getElementById('pref-lang').value;
        const notif = document.getElementById('pref-notif').checked;
        const animations = document.getElementById('pref-animations').checked;
        const fontSize = document.getElementById('pref-font-size').value;
        const spacing = document.getElementById('pref-spacing').value;
        const autoEnabled = document.getElementById('pref-theme-auto').checked;

        profileCloudState.userState = Object.assign({}, profileCloudState.userState || {}, {
          font_size: String(fontSize),
          spacing: String(spacing),
          animations: Boolean(animations),
          language: String(lang),
          notif: Boolean(notif),
          theme_auto: Boolean(autoEnabled)
        });

        lowaWriteUserStatePatch(profileCloudState.userState).catch(() => {});
        
        // Apply animations preference
        if (!animations) {
          document.documentElement.style.setProperty('--transition-fast', '0s');
          document.documentElement.style.setProperty('--transition-medium', '0s');
        } else {
          document.documentElement.style.removeProperty('--transition-fast');
          document.documentElement.style.removeProperty('--transition-medium');
        }

        // Apply font size and spacing
        applyFontSize(fontSize);
        applySpacing(spacing);
        
        document.getElementById('prefs-adv-status').textContent = '✅ Préférences enregistrées';
        setTimeout(() => {
          document.getElementById('prefs-adv-status').textContent = '';
        }, 3000);
      }

      async function savePrefs() {
        const status = document.getElementById('cookie-consent').checked ? 'accepted' : 'declined';
        profileCloudState.userState = Object.assign({}, profileCloudState.userState || {}, { cookie_consent: status });
        const ok = await lowaWriteUserStatePatch(profileCloudState.userState);
        if (!ok) throw new Error('Save failed');
        document.getElementById('prefs-status').textContent = 'Préférences enregistrées';
        setTimeout(() => {
          document.getElementById('prefs-status').textContent = '';
        }, 3000);
      }

      addListenerById('profile-info-form', 'submit', async (e) => {
        e.preventDefault();
        const statusEl = document.getElementById('profile-info-status');
        const submitBtn = document.getElementById('save-profile-info');
        const prenom = document.getElementById('profile-prenom').value.trim();
        const nom = document.getElementById('profile-nom').value.trim();
        const sexe = document.getElementById('profile-sexe').value;

        submitBtn.disabled = true;
        statusEl.textContent = 'Enregistrement en base...';

        try {
          const ok = await lowaWritePublicProfilePatch({ prenom, nom, sexe });
          if (!ok) throw new Error('Impossible de synchroniser le profil');
          profileCloudState.profile = Object.assign({}, profileCloudState.profile || {}, { prenom, nom, sexe });
          statusEl.textContent = 'Profil enregistré dans la base de données';
          await fetchUser();
          setTimeout(() => { statusEl.textContent = ''; }, 3000);
        } catch (err) {
          statusEl.textContent = 'Erreur: ' + (err && err.message ? err.message : 'inconnue');
        } finally {
          submitBtn.disabled = false;
        }
      });

      addListenerById('save-prefs', 'click', async () => {
        try { await savePrefs(); } catch (e) { alert('Erreur: ' + e.message); }
      });

      addListenerById('pref-lang', 'change', saveAdvancedPrefs);
      addListenerById('pref-notif', 'change', saveAdvancedPrefs);
      addListenerById('pref-animations', 'change', saveAdvancedPrefs);
      addListenerById('pref-font-size', 'change', saveAdvancedPrefs);
      addListenerById('pref-spacing', 'change', saveAdvancedPrefs);

      addListenerById('logout-btn', 'click', async () => {
        try { await fetchWithApiFallback('logout', { method: 'POST', headers: { Authorization: sessionToken } }); } catch {}
        localStorage.removeItem('lowa_session');
        if (typeof clearActiveStorageUserId === 'function') clearActiveStorageUserId();
        window.location.href = '/';
      });

      // Avatar upload handler
      addListenerById('avatar', 'click', () => {
        document.getElementById('avatar-upload').click();
      });

      addListenerById('avatar-upload', 'change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        // Validate file type
        if (!file.type.startsWith('image/')) {
          alert('Veuillez sélectionner une image valide');
          return;
        }

        // Validate file size (max 2MB)
        if (file.size > 2 * 1024 * 1024) {
          alert('L\'image est trop grande (max 2MB)');
          return;
        }

        // Convert to base64
        const reader = new FileReader();
        reader.onload = async (event) => {
          const base64 = event.target.result;

          try {
            const avatarContainer = document.getElementById('avatar');
            const avatarText = document.getElementById('avatar-text');
            avatarContainer.style.backgroundImage = `url(${base64})`;
            avatarText.style.display = 'none';

            profileCloudState.userState = Object.assign({}, profileCloudState.userState || {}, { avatar: base64 });
            const ok = await lowaWriteUserStatePatch(profileCloudState.userState);
            if (!ok) {
              throw new Error('Échec de la mise à jour en base');
            }

            console.log('Photo de profil mise à jour avec succès');
          } catch (err) {
            console.warn('Mise à jour distante indisponible:', err && err.message ? err.message : err);
            alert('Impossible d\'enregistrer la photo dans la base de données.');
          }
        };
        reader.readAsDataURL(file);
      });

      const heroLogoutBtn = document.getElementById('logout-btn-hero');
      if (heroLogoutBtn) {
        heroLogoutBtn.addEventListener('click', async () => {
          try { await fetchWithApiFallback('logout', { method: 'POST', headers: { Authorization: sessionToken } }); } catch {}
          localStorage.removeItem('lowa_session');
          if (typeof clearActiveStorageUserId === 'function') clearActiveStorageUserId();
          window.location.href = '/';
        });
      }

      (async function init() {
        initTheme();
        loadSession();
        try {
          const supabaseReady = await ensureSupabaseLoaded();
          if (!supabaseReady) {
            console.warn('Supabase indisponible: démarrage en mode local');
          }
          console.log('Initialisation du profil...');
          await hydrateProfileStateFromCloud();
          await fetchUser();
          await fetchHistory();
          await loadPrefs();
          loadAdvancedPrefs();
          console.log('Profil chargé avec succès');
        } catch (e) {
          console.error('Profil - récupération utilisateur échouée:', e);
          let msg = 'Aucune session trouvée. Connectez-vous depuis la page d\'accueil.';
          if (e && e.message && e.message.includes('API')) {
            msg = 'Impossible de récupérer vos informations du serveur. Vérifiez votre connexion.';
          }
          document.getElementById('user-info').innerHTML = `<div class="info-row"><strong>⚠️ Connexion requise</strong> <span>${msg}</span></div>`;
        }
      })();
    </script>
  </body>
</html>
