<svg viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="600" fill="#f0f5f0"/>
  <defs>
    <linearGradient id="chemiseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f5f5f0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ececec;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Shirt body -->
  <path d="M 150 90 L 210 110 L 210 500 L 90 500 Z" fill="url(#chemiseGrad)" stroke="#bbb" stroke-width="2"/>
  <path d="M 450 90 L 390 110 L 390 500 L 510 500 Z" fill="url(#chemiseGrad)" stroke="#bbb" stroke-width="2"/>
  <!-- Sleeves -->
  <path d="M 100 140 L 40 160 L 45 420 L 120 400 Z" fill="url(#chemiseGrad)" stroke="#bbb" stroke-width="2"/>
  <path d="M 500 140 L 560 160 L 555 420 L 480 400 Z" fill="url(#chemiseGrad)" stroke="#bbb" stroke-width="2"/>
  <!-- Collar -->
  <polygon points="250,90 350,90 330,150 270,150" fill="url(#chemiseGrad)" stroke="#bbb" stroke-width="2"/>
  <!-- Buttons -->
  <circle cx="210" cy="160" r="6" fill="#ddd" stroke="#999" stroke-width="1"/>
  <circle cx="210" cy="240" r="6" fill="#ddd" stroke="#999" stroke-width="1"/>
  <circle cx="210" cy="320" r="6" fill="#ddd" stroke="#999" stroke-width="1"/>
  <circle cx="210" cy="400" r="6" fill="#ddd" stroke="#999" stroke-width="1"/>
  <!-- Chest pocket -->
  <rect x="145" y="180" width="30" height="40" fill="none" stroke="#bbb" stroke-width="1.5"/>
  <line x1="160" y1="180" x2="165" y2="220" stroke="#bbb" stroke-width="1" opacity="0.5"/>
</svg>